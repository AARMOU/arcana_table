name: Android targeting experiment

on:
  push:
    branches:
      - experimental/targeting
      - experimental/arcana-argentum-integration
      - GPT-eating-glue # Build the hand-tray auto-pass change
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check out Argentum engine
        uses: actions/checkout@v4
        with:
          repository: wingedsheep/argentum-engine
          ref: d1b1c36aaeb293529986d68faf77744b8b308122
          path: argentum-engine

      - name: Set up Java 21 for rules engine
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build patched Argentum rules engine
        run: |
          cd argentum-engine
          git apply ../android/patches/argentum-engine-name-equals.patch
          ./gradlew :rules-engine:jar
          cp rules-engine/build/libs/rules-engine.jar ../android/app/libs/argentum-rules-engine.jar

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Assemble experimental APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: ArcanaTable-Argentum-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Run custom card rules scenarios
        working-directory: android
        run: ./gradlew :custom-cards:test

      - name: Run unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest
