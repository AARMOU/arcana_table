name: Stabilization control regressions
# Runs on every PR (no path filter) so it can be a required check without blocking
# unrelated docs/website PRs. The Node suite takes seconds.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/*.test.cjs control/*.test.cjs control/review-worker/tests/*.test.mjs
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: git diff --check
