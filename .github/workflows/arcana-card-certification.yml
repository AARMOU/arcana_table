name: Arcana Independent Card Certification Preflight
# Trusted main monitor. Green Copilot CI is not independent Oracle certification.
# This does not run independent engine tests yet: no candidate can be certified
# until separately authenticated independent proof is connected.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  checks: read
  issues: write
concurrency:
  group: arcana-card-certification-preflight
  cancel-in-progress: false
jobs:
  audit:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test independent certification gate
        run: node --test scripts/card-certification.test.cjs
      - uses: actions/github-script@v7
        with:
          script: |
            const C=require('./scripts/card-certification.cjs');
            const payload=await C.collect({github,...context.repo});
            core.info('Certifiable cards: '+payload.certifiedCandidates+
              '; not certified: '+payload.needsIndependentVerification);
            await core.summary.addHeading('Independent Oracle preflight').addRaw(C.summary(payload).join('\n')).write();
            const status=await C.publish({github,...context.repo,payload});
            core.info('Independent certification informational status: '+status);
