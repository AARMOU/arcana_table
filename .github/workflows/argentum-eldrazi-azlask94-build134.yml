          root = Path('android/app/build/test-results/testDebugUnitTest')
          emitted = 0
          for f in sorted(root.rglob('TEST-*.xml')):
              suite = ET.parse(f).getroot()
              out = (suite.findtext('system-out') or '')
              trail = [l for l in out.splitlines() if l.startswith('[shock-fetch]')]
              if trail:
                  print('::warning title=shock-fetch trail::' + esc('\n'.join(trail[-45:])[:20000]))
              for case in suite.iter('testcase'):
                  for kind in ('failure', 'error'):
                      el = case.find(kind)
                      if el is None or emitted >= 8: continue
                      emitted += 1
                      text = (el.get('message') or '') + '\n' + (el.text or '')[:3000]
                      print(f"::error title={case.get('classname')}.{case.get('name')} {kind}::" + esc(text[:20000]))
          print(f'annotated {emitted} failing test(s)')
          PY
