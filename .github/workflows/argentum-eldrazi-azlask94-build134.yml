name: Build 134 coherent release-source preview (owner approval required)
# Follow-up to #223: prepare only a throwaway merged worktree and test whether
# legacy Eldrazi engine source patches apply to the newly upgraded Argentum.
# No production jar publication, branch mutation, production signing or deploy.
# Reproducible isolated integration candidate: no production branch is mutated.
# One-time owner-approved preview trigger on this isolated branch ONLY.
# Review/validation steps and generated artifact remain exactly as staged in PR #254.
on:
  push:
    branches: ['gpt/owner-approved-build134-preview-20261026-0515']
    paths:
      - '.github/workflows/argentum-eldrazi-azlask94-build134.yml'
concurrency:
  group: arcana-b134-final-preview-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reconcile exact four known text conflicts on runner only
        env:
          UPGRADE: e66eca84125c3180c676702a72ae6cd080f85797
          ELDRAZI: 7e6fc1aa8d6ccca30a6fab7fdebc7e08199efbb3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name arcana-source-preflight
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mkdir -p combined-evidence
          git merge-base --is-ancestor "$UPGRADE" HEAD
          git fetch --no-tags origin "$ELDRAZI"
          test "$(git rev-parse FETCH_HEAD)" = "$ELDRAZI"
          git show "$ELDRAZI:tools/cardkit/data/known-blockers.json" > /tmp/eldrazi-blockers.json
          git show "$UPGRADE:tools/cardkit/data/known-blockers.json" > /tmp/upgrade-blockers.json
          git show "$ELDRAZI:engine-upgrade/UPGRADE-TEMPLATE.md" > /tmp/eldrazi-upgrade-template.md
          set +e
          git merge --no-commit --no-ff --no-edit "$ELDRAZI" > combined-evidence/merge.log 2>&1
          merge_code=$?
          set -e
          test "$merge_code" -ne 0
          git diff --name-only --diff-filter=U | sort > combined-evidence/conflicts.txt
          cat > /tmp/expected-conflicts.txt <<'EOF'
          docs/agents/generated/pattern-index.json
          docs/agents/generated/pattern-index.md
          engine-upgrade/UPGRADE-TEMPLATE.md
          tools/cardkit/data/known-blockers.json
          EOF
          diff -u /tmp/expected-conflicts.txt combined-evidence/conflicts.txt
          # The generated index is regenerated from the merged source; old data must not survive.
          git checkout --ours -- docs/agents/generated/pattern-index.json docs/agents/generated/pattern-index.md
          # Keep weekly handoff instructions; append the legacy Eldrazi engine-patch rule verbatim.
          git checkout --ours -- engine-upgrade/UPGRADE-TEMPLATE.md
          python3 - <<'PY'
          from pathlib import Path
          old = Path('/tmp/eldrazi-upgrade-template.md').read_text()
          p = Path('engine-upgrade/UPGRADE-TEMPLATE.md')
          tag = 'Adding an engine change:'
          assert old.count(tag) == 1
          assert tag not in p.read_text()
          addition = old[old.index(tag):].strip()
          assert 'MANDATORY' in addition
          p.write_text(p.read_text().rstrip() + '\n\n' + addition + '\n')
          PY
          # Preserve new verified Eldrazi blockers while retiring the obsolete named Port Town.
          git checkout --ours -- tools/cardkit/data/known-blockers.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          ours = json.loads(Path('/tmp/upgrade-blockers.json').read_text())
          theirs = json.loads(Path('/tmp/eldrazi-blockers.json').read_text())
          for section in ('cards', 'keywords'):
              for key, value in theirs[section].items():
                  if key == 'Port Town': continue
                  if key in ours[section]:
                      assert ours[section][key] == value, (section, key, 'different conflict needs review')
                  else:
                      ours[section][key] = value
          old_names = {p['name']:p for p in ours['patterns']}
          for p in theirs['patterns']:
              if p['name'] in old_names:
                  assert old_names[p['name']] == p, ('pattern conflict', p['name'])
              else:
                  ours['patterns'].append(p)
          assert 'Port Town' not in ours['cards']
          path = Path('tools/cardkit/data/known-blockers.json')
          path.write_text(json.dumps(ours, indent=2, ensure_ascii=False) + '\n')
          PY
          git add docs/agents/generated/pattern-index.json docs/agents/generated/pattern-index.md engine-upgrade/UPGRADE-TEMPLATE.md tools/cardkit/data/known-blockers.json
          test -z "$(git diff --name-only --diff-filter=U)"
          tools/cardkit/cardkit patterns
          git diff --check
          python3 -m json.tool tools/cardkit/data/known-blockers.json >/dev/null
          printf 'reconciled known text conflicts and regenerated pattern index; no commit\n' > combined-evidence/reconciliation.txt
      - name: Finish local merged source and integrate exact development head
        shell: bash
        env:
          DEV_SHA: 1751f1893cc4706572d4f4382e6b0a137bf46536
        run: |
          set -euo pipefail
          git add -u
          # Historical .patch and rerere preimage files intentionally contain conflict markers/whitespace.
          # Validate staged application/source code, but never rewrite patch/rerere evidence.
          git diff --cached --check -- android/app android/custom-cards tools/cardkit
          git commit --no-gpg-sign -m "Temporary local source merge for CI only"
          git fetch --no-tags origin "$DEV_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$DEV_SHA"
          set +e
          git merge --no-commit --no-ff --no-edit "$DEV_SHA" > combined-evidence/latest-development-merge.log 2>&1
          status=$?
          set -e
          cat combined-evidence/latest-development-merge.log
          git diff --name-only --diff-filter=U > combined-evidence/latest-development-conflicts.txt
          if [ "$status" -ne 0 ] || [ -s combined-evidence/latest-development-conflicts.txt ]; then
            path=android/app/src/main/java/com/arcanatable/TableDialogs.kt
            # Only the *known* two-line Eldrazi priority preference collides with
            # PR #250's Help & Diagnostics improvements. Any other conflict fails closed.
            expected=$(printf '%s\n' android/app/src/main/java/com/arcanatable/HomeScreen.kt android/app/src/main/java/com/arcanatable/TableController.kt "$path")
            if [ "$(cat combined-evidence/latest-development-conflicts.txt)" != "$expected" ]; then
              echo "::error title=Unknown integration conflict::Unexpected conflicting paths"
              cat combined-evidence/latest-development-conflicts.txt
              exit 1
            fi
            git show "HEAD:$path" > /tmp/eldrazi-table-dialogs.kt
            git show "$DEV_SHA:$path" > /tmp/development-table-dialogs.kt
            python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/java/com/arcanatable/TableDialogs.kt')
          ours = Path('/tmp/eldrazi-table-dialogs.kt').read_text()
          dev = Path('/tmp/development-table-dialogs.kt').read_text()
          # Original 94-slot Eldrazi changes are these exact two additions.
          param = '    respondToOwnStack: Boolean = false, onRespondToOwnStack: (Boolean) -> Unit = {},'
          toggle = '                SettingsToggle("Respond to my spells and abilities", "Offline games: keep priority over your own stack when you have a legal response. Turn this on before casting to build Ulalek stacks.", respondToOwnStack, onRespondToOwnStack, Modifier)'
          param_after = '    quietOpponentTurns: Boolean = false, onQuietOpponentTurns: (Boolean) -> Unit = {},'
          toggle_before = '                SettingsToggle("Skip AI actions unless needed",'
          assert ours.count(param) == 1 and ours.count(toggle) == 1, 'Eldrazi priority-stop UI changed'
          assert dev.count(param) == dev.count(toggle) == 0, 'Duplicate priority UI unexpectedly on development'
          assert dev.count(param_after) == 1 and dev.count(toggle_before) == 1
          assert dev.count('Engine running notice') == 1 and dev.count('diagnostics-test-connection') == 1
          merged = dev.replace(param_after, param + '\n' + param_after, 1)
          merged = merged.replace(toggle_before, toggle + '\n' + toggle_before, 1)
          assert merged.count(param) == 1 and merged.count(toggle) == 1
          assert merged.count('Engine running notice') == 1
          path.write_text(merged)
          print('PASS: preserved legacy Eldrazi respond-to-own-stack toggle and new PR #250 Help & Diagnostics')
          PY
            home=android/app/src/main/java/com/arcanatable/HomeScreen.kt
            git show "HEAD:$home" > /tmp/eldrazi-home.kt
            git show "$DEV_SHA:$home" > /tmp/development-home.kt
            python3 - <<'PYHOME'
          from pathlib import Path
          ours = Path('/tmp/eldrazi-home.kt').read_text()
          dev = Path('/tmp/development-home.kt').read_text()
          start = '                Text("ARCANA TABLE",'
          old_start = '                Text(if (testScenarios.isNotEmpty())'
          end = '                    Icon(Icons.Filled.Settings,'
          assert dev.count(start) == ours.count(old_start) == 1
          assert dev.count(end) == ours.count(end) == 1
          a, b = dev.index(start), dev.index(end)
          c, d = ours.index(old_start), ours.index(end)
          block = ours[c:d]
          icon = 'Modifier.size(48.dp).clip(CircleShape)'
          assert block.count(icon) == 1 and 'test-scenarios-entry' in block
          assert dev.count('.tutorialTarget("home-settings")') == 1
          block = block.replace(icon, 'Modifier.size(48.dp).tutorialTarget("home-settings").clip(CircleShape)', 1)
          # Keep Git's successfully merged state and picker sheet, not just
          # development's older whole file. Replace only the reviewed header conflict.
          import os
          path = Path('android/app/src/main/java/com/arcanatable/HomeScreen.kt')
          value = path.read_text()
          conflict = ('<<<<<<< HEAD\n' + ours[c:d].rstrip('\n') + '\n=======\n'
                      + dev[a:b].rstrip('\n') + '\n>>>>>>> ' + os.environ['DEV_SHA'])
          assert value.count('<<<<<<< HEAD') == value.count(conflict) == 1, 'Unknown home conflict'
          merged = value.replace(conflict, block.rstrip('\n'), 1)
          assert merged.count('test-scenarios-entry') == 1
          assert merged.count('.tutorialTarget("home-settings")') == 1
          assert merged.count('var scenarioPickerOpen by remember') == 1, 'QA picker state lost'
          assert merged.count('if (scenarioPickerOpen && testScenarios.isNotEmpty())') == 1, 'QA picker sheet lost'
          assert not any(marker in merged for marker in ('<<<<<<<', '=======', '>>>>>>>'))
          path.write_text(merged)
          print('PASS: debug QA entry and tutorial settings target both retained')
          PYHOME
            python3 - <<'PYCONTROLLER'
          import os
          from pathlib import Path
          path = Path('android/app/src/main/java/com/arcanatable/TableController.kt')
          value = path.read_text()
          priority = '        respondToOwnStack = JSONObject(checkpoint).optBoolean("respondToOwnStack")'
          guard = ('        require(ReleaseFeatures.multiplayerPreviewEnabled || seats.size == 2) {\n'
                   '            "This release can resume two-player games only. Your saved game was preserved."\n'
                   '        }')
          conflict = '<<<<<<< HEAD\n' + priority + '\n=======\n' + guard + '\n>>>>>>> ' + os.environ['DEV_SHA']
          assert value.count('<<<<<<< HEAD') == value.count(conflict) == 1, 'Unknown controller conflict'
          # Tutorial checkpoints must not replace the player's normal own-stack preference.
          restore = '        if (!tutorialPracticeActive) ' + priority.strip()
          value = value.replace(conflict, guard + '\n' + restore, 1)
          assert not any(marker in value for marker in ('<<<<<<<', '=======', '>>>>>>>'))
          path.write_text(value)
          print('PASS: release seat validation precedes restoring own-stack preference')
          PYCONTROLLER
            git add "$path" "$home" android/app/src/main/java/com/arcanatable/TableController.kt
            test -z "$(git diff --name-only --diff-filter=U)"
            git diff --cached --check -- "$path"
            echo "$path: merged Eldrazi priority preference with current Help & Diagnostics" > combined-evidence/latest-development-reconciliation.txt
          fi
          # Historical .patch and rerere preimage files intentionally contain conflict markers/whitespace.
          # Validate staged application/source code, but never rewrite patch/rerere evidence.
          git diff --cached --check -- android/app android/custom-cards tools/cardkit
          python3 - <<'PY'
          from pathlib import Path
          defs = Path("android/custom-cards/src/main/kotlin/com/arcanatable/customcards/CustomCards.kt").read_text()
          six = ["BlackMarketConnections", "CommissarSeverinaRaine", "JaheiraFriendOfTheForest", "ScurryOak", "TataruTaru", "WaywardSwordtooth"]
          for name in six: assert "Entry(" + name + "," not in defs, ("Duplicate custom card registration", name)
          assert Path("android/app/src/main/java/com/arcanatable/DeckBuilderScreen.kt").is_file(), "Latest dev's debug DeckBuilder absent"
          for relative in ("engine-upgrade/eldrazi-temple/candidate/EldraziTemple.kt",
                           "engine-upgrade/corrupted-crossroads/candidate/CorruptedCrossroads.kt"):
              assert Path(relative).is_file(), relative
          print("PASS: current development debug deck builder, six upstream-only definitions, both Eldrazi candidate cards")
          PY
          echo "Verified local source merge with $DEV_SHA; no remote writes" > combined-evidence/latest-development-join.txt
      - name: Stage reviewed DeckSupport keyword test fix from exact isolated SHA
        shell: bash
        env:
          FIX_BASE_SHA: a7961ea55314610ecdf02f164570f215f81278ac
          TEST_FIX_SHA: 6cf456733fd2c870d4db6888caa067399336f357
        run: |
          set -euo pipefail
          path=android/app/src/test/java/com/arcanatable/DeckSupportTest.kt
          git fetch --no-tags origin "$TEST_FIX_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$TEST_FIX_SHA"
          git merge-base --is-ancestor "$FIX_BASE_SHA" "$TEST_FIX_SHA"
          # The isolated PR #233 is exactly one test-file change, never a hidden
          # engine/asset change or a skip/disable of the failing regression.
          test "$(git diff --name-only "$FIX_BASE_SHA" "$TEST_FIX_SHA")" = "$path"
          test "$(git hash-object "$path")" = 9612b26f56c80d2e3e9e212c44c49d1e7c5db8ed
          git show "$TEST_FIX_SHA:$path" > /tmp/DeckSupportTest.kt
          test "$(git hash-object /tmp/DeckSupportTest.kt)" = cde361d1cb366733888ab985766f53cd73a365f5
          cp /tmp/DeckSupportTest.kt "$path"
          grep -F 'upstream cards must not retain shadowing custom definitions' "$path"
          grep -F 'every probed card must remain in the shipped library' "$path"
          git diff --check -- "$path"
          echo "DeckSupportTest upstream migration fix PR #233: $TEST_FIX_SHA" > combined-evidence/decksupport-regression-fix.txt
      - name: Align merged QA home fixture with the current welcome invitation
        shell: bash
        run: |
          python3 - <<'PYFIXTURE'
          from pathlib import Path
          path = Path('android/app/src/test/java/com/arcanatable/ui/HomeScreenSizesTest.kt')
          value = path.read_text()
          before = 'rule.onNodeWithText("Dismiss").performClick()'
          after = 'rule.onNodeWithText("NOT NOW").performClick()'
          assert value.count(before) == 1 and value.count(after) == 0, 'Unknown welcome fixture'
          assert 'scenariosOpenFromHeaderWithoutHuntingBelowDeck' in value
          assert value.count('@Test') == 5
          assert 'test-scenario-ulalek-own-stack' in value and 'test-scenario-eldrazi-displacer-blink' in value
          value = value.replace(before, after, 1)
          path.write_text(value)
          print('PASS: current welcome label; all five layout and QA picker checks retained')
          PYFIXTURE
      - name: Verify Android regex guard on the exact merged app source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/tests -p 'test_android_regex.py'
          python3 tools/check_android_regex.py
      - name: Require original Arcana logo after exact development source merge
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_launcher_branding.py
          grep -F 'optionPrefs.getBoolean("show_engine_status", BuildConfig.DEBUG)' android/app/src/main/java/com/arcanatable/TableController.kt
          grep -F 'Engine running notice' android/app/src/main/java/com/arcanatable/TableDialogs.kt
          test -f android/app/src/test/java/com/arcanatable/LauncherBrandingTest.kt
      - name: Fetch and verify green upgraded-engine candidate evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/AARMOU/arcana_table/actions/artifacts/12612323185/zip -o /tmp/upgrade-candidate.zip
          echo '2eca4e497de60cb3ff0d20a5df7c3635ac5be7e7881900a1b606926da1321cc0  /tmp/upgrade-candidate.zip' | sha256sum -c -
          unzip -p /tmp/upgrade-candidate.zip candidate.patch > /tmp/upgrade-candidate.patch
          echo '065ba023c1fab0c855318f0dd70e55592cc340cbf72263019ef6ea136e90231c  /tmp/upgrade-candidate.patch' | sha256sum -c -
          git apply --check --include='argentum-patches/*' /tmp/upgrade-candidate.patch
          git apply --include='argentum-patches/*' /tmp/upgrade-candidate.patch
          printf '%s\n' 'Verified exact green run 40228118365, upstream c38f145359c342a04f951b7ba48f741bcb1627ac, patch inputs refreshed.' > combined-evidence/upgrade-inputs.txt
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: wingedsheep/argentum-engine
          ref: c38f145359c342a04f951b7ba48f741bcb1627ac
          path: combined-argentum
          fetch-depth: 0  # full source history, including patch base blobs needed by git apply --3way
          persist-credentials: false
      - name: Verify three-way base blob availability (read-only)
        shell: bash
        run: |
          set -euo pipefail
          for sha in 4b9ad564e0 502fcf5dc7 9dafe60071; do
            git -C combined-argentum cat-file -e "$sha^{blob}"
            echo "Base Git blob available: $sha"
          done
      - name: Strict patch-series applicability on upgraded upstream
        shell: bash
        run: |
          set -euo pipefail
          printf 'upstream c38f145359c342a04f951b7ba48f741bcb1627ac\n' > combined-evidence/patch-preflight.txt
          python3 - <<'PY'
          import subprocess, sys
          from pathlib import Path
          engine = Path('combined-argentum')
          patches = [Path('argentum-patches') / f'{n:04d}-{name}.patch' for n,name in [
              (1,'android-regex'), (2,'engine-trial-build'),
              (3,'full-library-export'), (4,'token-copy-triggered-abilities'),
              (5,'last-known-negative-subtype'), (6,'ai-decision-deadline'),
              (7,'ai-bounded-stack-search'), (8,'jvm-test-toolchain')]]
          patches += sorted(Path('argentum-patches').glob('001[1-6]-*.patch'))
          # The 93-slot candidate also has Temple and Crossroads extension patches.
          patches += [
              Path('engine-upgrade/eldrazi-temple/patches/0001-colorless-eldrazi-source-mana.patch'),
              Path('engine-upgrade/eldrazi-combined/patches/0002-devoid-after-temple.patch')]
          report = Path('combined-evidence/patch-preflight.txt')
          for patch in patches:
              assert patch.is_file(), f'missing required patch: {patch}'
              base = ['git', '-C', str(engine), 'apply']
              check = subprocess.run(base + ['--check', str(patch.resolve())], capture_output=True, text=True)
              if check.returncode:
                  # Exact hunks moved upstream: test Git's index-backed three-way merge,
                  # but fail closed on any real conflict. No source is published by this job.
                  actual = subprocess.run(base + ['--3way', str(patch.resolve())],
                                          capture_output=True, text=True)
                  with report.open('a') as f:
                      f.write('THREEWAY ' + str(patch) + ' exit=' + str(actual.returncode)
                              + '\n' + actual.stdout + actual.stderr)
                  if actual.returncode:
                      # Source port only for the known, reviewed 0011 conflict. Every
                      # other patch remains fail-closed; never silently drop any hunk.
                      if patch.name == '0001-colorless-eldrazi-source-mana.patch':
                          # Source-compatibility port for Temple's source-restricted mana.
                          # Preserve upstream's newer Class-level source-payment context.
                          reject = subprocess.run(base + ['--reject', str(patch.resolve())],
                                                  capture_output=True, text=True)
                          with report.open('a') as f:
                              f.write('TEMPLE_REJECT_DIAGNOSTIC exit='
                                      + str(reject.returncode) + '\n' + reject.stdout + reject.stderr)
                          root = engine
                          ability = root / 'rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/mana/AbilityPaymentContextBuilder.kt'
                          index = root / 'docs/sdk-index.md'
                          baseline = root / 'mtg-sdk/src/test/resources/sdk-surface-baseline.txt'
                          allowed = {str(p) + '.rej' for p in (ability, index, baseline)}
                          rejected = {str(p) for p in root.rglob('*.rej')}
                          assert rejected <= allowed, ('unreviewed Temple rejects', rejected - allowed)
                          payment = ability.read_text()
                          if 'isAbilitySourceColorless =' not in payment:
                              needle = '        abilitySourceCardTypes = cardTypes,\n'
                              assert payment.count(needle) == 1
                              payment = payment.replace(needle, needle +
                                  '        // Projected characteristics on the battlefield; printed colors in other zones.\n'
                                  '        isAbilitySourceColorless = if (sourceId in projected.getBaseState().getBattlefield()) {\n'
                                  '            projected.getColors(sourceId).isEmpty()\n'
                                  '        } else {\n'
                                  '            cardComponent.colors.isEmpty()\n'
                                  '        },\n', 1)
                              ability.write_text(payment)
                          assert payment.count('isAbilitySourceColorless =') == 1
                          chunks = patch.read_text().split('diff --git ')
                          def patch_added(prefix):
                              found = [l[1:] for c in chunks for l in c.splitlines()
                                       if l.startswith('+' + prefix)]
                              assert len(found) == 1, (prefix, len(found))
                              return found[0]
                          def insert_after(path, prefix, new_line):
                              lines = path.read_text().splitlines()
                              if new_line in lines: return
                              matches = [i for i, l in enumerate(lines) if l.startswith(prefix)]
                              assert len(matches) == 1, (path, prefix, len(matches))
                              lines.insert(matches[0] + 1, new_line)
                              path.write_text('\n'.join(lines) + '\n')
                          insert_after(index, '- ' + chr(96) + 'ManaRestriction.ColorlessSpellsOnly' + chr(96),
                                       patch_added('- ' + chr(96) + 'ManaRestriction.ColorlessSubtypeSpellsOrAbilitiesOnly'))
                          insert_after(baseline, 'LoyaltyDamageFloor — ReplacementEffect',
                                       patch_added('ManaRestriction.ColorlessSubtypeSpellsOrAbilitiesOnly'))
                          assert 'data class ColorlessSubtypeSpellsOrAbilitiesOnly' in (
                              root / 'mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/scripting/effects/ManaRestriction.kt').read_text()
                          for reject_file in rejected: Path(reject_file).unlink()
                          assert not list(root.rglob('*.rej')), 'No partial Temple rejects allowed'
                          with report.open('a') as f:
                              f.write('MANUAL_PORT Temple: source colors and current SDK index/baseline retained\n')
                          print('PORTED Temple restricted mana on upgraded upstream, testing Devoid next')
                          continue
                      if patch.name != '0011-stack-object-copying.patch':
                          print('BLOCKED:', patch, check.stderr, actual.stdout, actual.stderr,
                                file=sys.stderr)
                          sys.exit(1)
                      reject = subprocess.run(base + ['--reject', str(patch.resolve())],
                                              capture_output=True, text=True)
                      with report.open('a') as f:
                          f.write('REJECT_DIAGNOSTIC ' + str(patch) + ' exit='
                                  + str(reject.returncode) + '\n' + reject.stdout + reject.stderr)
                      root = engine / 'rules-engine/src/main/kotlin/com/wingedsheep/engine'
                      refs = root / 'handlers/continuations/ObjectReferencePropagation.kt'
                      placement = root / 'mechanics/stack/StackPlacement.kt'
                      obsolete = root / 'handlers/effects/stack/CopyEachTargetSpellExecutor.kt'
                      generic = root / 'handlers/effects/stack/CopyStackObjectsExecutor.kt'
                      expected = {str(refs) + '.rej', str(placement) + '.rej'}
                      rejected = {str(p) for p in engine.rglob('*.rej')}
                      assert rejected == expected, ('unexpected source rejects', rejected, expected)
                      assert obsolete.is_file() and generic.is_file()
                      # The upstream spell-copy executor gained keyword-action replacement
                      # counts. New CopyStackObjectsExecutor delegates each individual
                      # spell copy to CopyTargetSpellEffect, whose upstream executor already
                      # applies KeywordActionAmountModifier.copySpell. Keep that behavior.
                      original = obsolete.read_text()
                      assert 'KeywordActionAmountModifier.copySpell' in original
                      assert 'CopyTargetSpellEffect' in generic.read_text()
                      def one(path, needle, replacement):
                          data = path.read_text()
                          assert data.count(needle) == 1, (path, needle, data.count(needle))
                          path.write_text(data.replace(needle, replacement, 1))
