name: Deploy Arcana Table site

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "privacy.html"
      - "closed-testing.html"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Stage the landing page
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp privacy.html _site/privacy.html
          cp closed-testing.html _site/closed-testing.html
          cp -R assets _site/assets
      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
