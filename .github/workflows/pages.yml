name: Deploy Arcana Table site

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "privacy.html"
      - "closed-testing.html"
      - "assets/**"
      - "control/**"
      - "tools/argentum-catalog.cjs"
      - "tools/deck-gap-audit.cjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  # Self-heal: if the newest deploy of main failed (e.g. the repository's shared hourly API quota ran out),
  # deploy again at the next tick. Does nothing when the last deploy succeeded.
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  needed:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - id: check
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'schedule') { core.setOutput('deploy', 'true'); return; }
            const runs = (await github.rest.actions.listWorkflowRuns({ ...context.repo, workflow_id: 'pages.yml', branch: 'main', per_page: 10 })).data.workflow_runs
              .filter(r => r.event !== 'schedule' || r.conclusion === 'success');
            const last = runs.find(r => r.status === 'completed');
            const failed = !!last && last.conclusion !== 'success' && !runs.some(r => r.status !== 'completed');
            core.info('Newest non-scheduled deploy: ' + (last ? last.id + ' ' + last.conclusion : 'none') + ' → redeploy ' + failed);
            core.setOutput('deploy', String(failed));
  deploy:
    needs: needed
    if: needs.needed.outputs.deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
      - name: Check out integration deck data (not executable code)
        uses: actions/checkout@v4
        with:
          ref: gpt/arcana-integration-next
          path: integration-source
          persist-credentials: false
      - name: Check out B141 card indexes (data only)
        # Approved cards are integrated into the build branch (B141 since 2026-11-01; integration/policy.json) and never
        # merge back into the card branch, so a card counts as present when either branch indexes it.
        uses: actions/checkout@v4
        with:
          ref: gpt/b141-candidate-20261101
          path: b140-source
          persist-credentials: false
          sparse-checkout: android/app/src/main/assets/argentum
      - name: Configure GitHub Pages
        # Its outputs are unused; a refused Pages API read (shared hourly quota) must not block the deploy.
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Validate control dashboard
        run: node --test control/dashboard.test.cjs control/card-queue.test.cjs control/review-auth-browser.test.cjs control/goosegeta.test.cjs tools/tests/argentum-catalog.test.cjs
      - name: Generate deck scanner JSON from reviewed tool and current integration data
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git -C integration-source rev-parse HEAD)"
          B140_SHA="$(git -C b140-source rev-parse HEAD)"
          idx=android/app/src/main/assets/argentum/custom-cards.index.tsv
          cat "b140-source/$idx" >> "integration-source/$idx"
          echo "Card indexes: gpt/arcana-integration-next@$SOURCE_SHA + B140 custom cards @$B140_SHA"
          mkdir -p _site/control
          node tools/deck-gap-audit.cjs --root integration-source --source-ref "gpt/arcana-integration-next@$SOURCE_SHA" --json _site/control/card-gaps.json --markdown /tmp/arcana-card-gaps.md
          node tools/argentum-catalog.cjs --root integration-source --source-ref "gpt/arcana-integration-next@$SOURCE_SHA" --json _site/control/argentum-catalog.json
      - name: Stage the landing page
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp privacy.html _site/privacy.html
          cp closed-testing.html _site/closed-testing.html
          cp -R assets _site/assets
          mkdir -p _site/control
          cp control/index.html _site/control/index.html
          cp control/cards.html _site/control/cards.html
          cp control/card-queue.js _site/control/card-queue.js
          cp control/card-preflight.js _site/control/card-preflight.js
          cp control/review.js _site/control/review.js
          cp control/card-ready-notifications.js _site/control/card-ready-notifications.js
          cp control/authorize.js _site/control/authorize.js
          cp control/team-checkin.js _site/control/team-checkin.js
          cp control/goosegeta.js _site/control/goosegeta.js
          cp control/credits.html _site/control/credits.html
          cp control/credit-budget.js _site/control/credit-budget.js
          cp control/manifest.webmanifest _site/control/manifest.webmanifest
          cp control/sw.js _site/control/sw.js
          # Stamp the build so every deploy installs a new app worker: fast cached opens, immediate updates.
          sed -i "s/^const BUILD='dev';/const BUILD='${GITHUB_SHA::12}';/" _site/control/sw.js
          grep -q "^const BUILD='${GITHUB_SHA::12}';" _site/control/sw.js
          cp -R control/icons _site/control/icons
      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
