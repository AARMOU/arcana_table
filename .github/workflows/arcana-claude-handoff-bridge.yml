name: Arcana Claude Handoff Bridge (explicit authorization only)
# A tiny event bridge, NOT a second card dispatcher. Defaults OFF.
# Sends a single owner-authorized #81 comment to an existing Claude Code
# cloud scheduled task API trigger. NO APK, merges, or Copilot assignments.
on:
  issue_comment:
    types: [created]
permissions: {}
concurrency:
  group: arcana-claude-handoff-bridge
  cancel-in-progress: false
jobs:
  handoff:
    if: >-
      ${{ github.event.issue.number == 81 &&
          github.event.comment.user.login == 'AARMOU' &&
          contains(github.event.comment.body, '<!-- arcana-claude-run-authorized-v1 -->') &&
          vars.ARCANA_CLAUDE_HANDOFF_READY == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      issues: write
    steps:
      - name: Guard, reserve at most once, and fire connected Claude task
        uses: actions/github-script@v7
        env:
          CLAUDE_ROUTINE_FIRE_URL: ${{ vars.ARCANA_CLAUDE_ROUTINE_FIRE_URL }}
          CLAUDE_ROUTINE_FIRE_TOKEN: ${{ secrets.ARCANA_CLAUDE_ROUTINE_FIRE_TOKEN }}
        with:
          script: |
            const source = context.payload.comment;
            const sourceId = source.id;
            const marker = '<!-- arcana-claude-dispatch-v1 source=' + sourceId + ' -->';
            const url = process.env.CLAUDE_ROUTINE_FIRE_URL || '';
            const token = process.env.CLAUDE_ROUTINE_FIRE_TOKEN || '';
            // Fail closed before recording a reservation. No untrusted destinations.
            if (!/^https:\/\/api\.anthropic\.com\/v1\/claude_code\/routines\/trig_[a-zA-Z0-9_-]+\/fire$/.test(url) || token.length < 20) {
              core.setFailed('Claude routine API trigger is not configured; no session started.');
              return;
            }
            // #81 is a long-lived ledger. Paginate rather than relying on a stale first page.
            const comments = await github.paginate(github.rest.issues.listComments,
              { ...context.repo, issue_number: 81, per_page: 100 });
            if (comments.some(c => (c.body || '').includes(marker))) {
              core.info('This exact handoff was already reserved. No duplicate launch.');
              return;
            }
            const completed = new Set();
            for (const c of comments) {
              if (c.user?.login !== 'AARMOU') continue;
              const m = (c.body || '').match(/<!-- arcana-claude-handoff-complete-v1 source=(\d+) -->/);
              if (m) completed.add(m[1]);
            }
            for (const c of comments) {
              const m = (c.body || '').match(/<!-- arcana-claude-dispatch-v1 source=(\d+) -->/);
              if (m && !completed.has(m[1])) {
                core.setFailed('Earlier Claude handoff #' + m[1] + ' is not closed in #81. No competing session launched.');
                return;
              }
            }
            // Reserve BEFORE the external API call. A failed acknowledgment can never
            // cause a second session for the same comment ID (at-most-once dispatch).
            const reservation = await github.rest.issues.createComment({
              ...context.repo, issue_number: 81,
              body: marker + '\nClaude launch reserved for #81 comment ' + sourceId +
                '. This is not evidence of worker pickup.'
            });
            const update = body => github.rest.issues.updateComment({
              ...context.repo, comment_id: reservation.data.id,
              body: marker + '\n' + body
            });
            try {
              const r = await fetch(url, {
                method: 'POST',
                headers: {
                  Authorization: 'Bearer ' + token,
                  'Content-Type': 'application/json',
                  'anthropic-beta': 'experimental-cc-routine-2026-04-01',
                  'anthropic-version': '2023-06-01'
                },
                body: JSON.stringify({
                  text: 'Owner-authorized Arcana Claude handoff: https://github.com/AARMOU/arcana_table/issues/81#issuecomment-' + sourceId +
                    '. Read the linked exact comment. Work only on that approved assignment. Confirm pickup and close it in #81.'
                }),
                signal: AbortSignal.timeout(30000)
              });
              if (!r.ok) throw new Error('Claude routine API HTTP ' + r.status);
              const payload = await r.json();
              if (!/^https:\/\/claude\.ai\/code\/session_[a-zA-Z0-9_-]+$/.test(payload.claude_code_session_url || ''))
                throw new Error('Claude routine response lacked a verified session URL');
              await update('Claude routine launch accepted: ' + payload.claude_code_session_url +
                '\n**Pickup/work completion NOT verified.** Await explicit STARTED and DONE/BLOCKED on #81.');
              core.info('Routine accepted a launch. No completion claimed.');
            } catch (error) {
              await update('Claude routine launch unconfirmed/blocked. No automatic retry. ' +
                String(error.message).slice(0, 160));
              core.setFailed('Claude routine launch failed or acknowledgment missing. No automatic retry.');
            }
