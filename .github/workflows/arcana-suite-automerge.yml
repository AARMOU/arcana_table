name: Arcana Suite Certification Report
# Reports exact-head suite certification eligibility. The owner decides whether to merge.
on:
  pull_request:
    paths:
      - 'certification/**'
      - '.github/workflows/arcana-suite-automerge.yml'
  workflow_run:
    workflows: [Arcana Card Certification Premerge]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: arcana-suite-automerge-${{ github.event_name }}-${{ github.event.pull_request.number || 'reports' }}
  cancel-in-progress: false
jobs:
  safeguard-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify report-only certification and fail-closed scenarios
        run: node --test certification/*.test.cjs
  report:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Restore GitHub API ETag cache (304 Not Modified does not count against the API quota)
        uses: actions/cache/restore@v4
        with:
          path: .gh-etag-cache
          key: gh-etag-v1-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          restore-keys: gh-etag-v1-
      - id: report
        uses: actions/github-script@v7
        env:
          ARCANA_READ_TOKEN: ${{ github.event_name != 'pull_request' && secrets.ARCANA_READ_TOKEN || '' }}
        with:
          script: |
            try { require('./scripts/gh-etag-cache.cjs').install(github, { core }); } catch (e) { core.info('GitHub API ETag cache unavailable: ' + e.message); }
            const { mergeSuitePr } = require('./certification/suite-automerge.cjs');
            const r = await mergeSuitePr({ github, ...context.repo, run: context.payload.workflow_run, core });
            core.info(JSON.stringify(r));
            await core.summary.addHeading('Suite certification - owner merge required').addCodeBlock(JSON.stringify(r, null, 1)).write();
      - name: Save GitHub API ETag cache
        if: always() && hashFiles('.gh-etag-cache/cache.json.gz') != ''
        uses: actions/cache/save@v4
        with:
          path: .gh-etag-cache
          key: gh-etag-v1-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
