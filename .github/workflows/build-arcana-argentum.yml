name: Build Arcana Argentum APK

on:
  push:
    branches:
      - experimental/arcana-argentum
    paths:
      - 'arcana-argentum/**'
      - '.github/workflows/build-arcana-argentum.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Unpack standalone Arcana Argentum Android client
        run: |
          mkdir -p appsrc
          unzip -q arcana-argentum/ArcanaArgentum-0.2.1-build3-source.zip -d appsrc
          chmod +x appsrc/android/gradlew
      - name: Run tests and build debug APK
        working-directory: appsrc/android
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ArcanaArgentum-0.2.1-build3
          path: appsrc/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
