name: Arcana Card Worker Dispatcher
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: read
concurrency:
  group: arcana-card-dispatcher
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Verify user-authenticated Copilot API token
        env:
          COPILOT_DISPATCH_TOKEN: ${{ secrets.COPILOT_DISPATCH_TOKEN }}
        run: |
          if [ -z "$COPILOT_DISPATCH_TOKEN" ]; then
            echo 'Copilot assignment requires a user-authenticated token; GITHUB_TOKEN is insufficient.' >&2
            exit 1
          fi
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.COPILOT_DISPATCH_TOKEN }}
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const maxWorkers = 6;
            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100
            });
            const active = prs.filter(p => p.draft &&
              p.head.repo?.full_name === owner + '/' + repo &&
              p.head.ref.startsWith('copilot/'));
            const available = Math.max(0, maxWorkers - active.length);
            core.info('Draft Copilot PRs: ' + active.length + '; open slots: ' + available);
            if (!available) return;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100
            });
            const queued = issues.filter(i => !i.pull_request &&
              i.title.startsWith('[Arcana Queue]') &&
              !(i.assignees || []).length).sort((a,b) => a.number - b.number);
            for (const issue of queued.slice(0, available)) {
              try {
                const response = await github.rest.issues.addAssignees({
                  owner, repo, issue_number: issue.number, assignees: ['copilot-swe-agent[bot]'],
                  agent_assignment: {
                    target_repo: owner + '/' + repo,
                    base_branch: 'gpt/six-precon-worker-integration-20261022'
                  }
                });
                const assigned = response.data.assignees?.some(a => a.login.toLowerCase().startsWith('copilot-swe-agent'));
                if (!assigned) {
                  core.setFailed('Copilot assignment not confirmed on issue #' + issue.number);
                  return;
                }
                core.info('Assigned queue issue #' + issue.number + ' to Copilot. Agent start must be verified separately.');
              } catch (e) {
                core.setFailed('Assignment failed on #' + issue.number + ': ' + e.message);
                return;
              }
            }
