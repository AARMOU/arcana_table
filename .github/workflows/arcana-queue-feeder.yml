name: Arcana Queue Feeder
# Read-only Cardkit classification runs without secrets. Trusted-main publish may
# open ONE GitHub Actions bot queue issue in enabled normal mode, preferring
# owner-submitted [Card Request] priorities that are already SUPPORTED / copilot.
# Only the separate guarded dispatcher can authorize a paid Copilot assignment.
on:
  schedule:
    - cron: '*/15 * * * *'
  # Wake on Copilot's completion if GitHub emits a workflow_run for its dynamic workflow.
  workflow_run:
    workflows: ['Running Copilot cloud agent']
    types: [completed]
  # Copilot PR activity wakes the feeder promptly when scheduled workflows are delayed.
  # Run only trusted main code, and only for Copilot PRs targeting our integration base.
  # Never check out or execute the PR head in a workflow with write permissions.
  # review_requested is what Copilot emits when its session finishes (copilot_work_finished), i.e. the
  # moment its dispatcher slot frees; the last synchronize happens while the slot is still held.
  pull_request_target:
    types: [opened, synchronize, ready_for_review, review_requested]
  workflow_dispatch:
    inputs:
      max:
        description: 'How many suggestions (1-5)'
        type: number
        default: 3
permissions:
  contents: read
concurrency:
  group: arcana-queue-feeder
  cancel-in-progress: false
jobs:
  suggest:
    # Integration-base Cardkit runs here with a read-only token and no repository secrets.
    if: >-
      ${{ vars.ARCANA_INTEGRATION_BASE != '' &&
      (github.event_name != 'pull_request_target' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'Copilot' &&
      github.event.pull_request.base.ref == vars.ARCANA_INTEGRATION_BASE &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && 'main' || github.workflow_sha }}
          path: ctl
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.ARCANA_INTEGRATION_BASE }}
          path: base
          persist-credentials: false
      - name: Restore GitHub API ETag cache (304 Not Modified does not count against the API quota)
        uses: actions/cache/restore@v4
        with:
          path: .gh-etag-cache
          key: gh-etag-v1-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          restore-keys: gh-etag-v1-
      - name: List owner-selected cards (trusted main code)
        uses: actions/github-script@v7
        env:
          ARCANA_READ_TOKEN: ${{ github.event_name != 'pull_request' && secrets.ARCANA_READ_TOKEN || '' }}
        with:
          script: |
            try { require('./ctl/scripts/gh-etag-cache.cjs').install(github, { core }); } catch (e) { core.info('GitHub API ETag cache unavailable: ' + e.message); }
            const {requestedDeck,publicDemand,DEMAND_ISSUE}=require('./ctl/scripts/queue-feeder.cjs');
            const openIssues=await github.paginate(github.rest.issues.listForRepo,{...context.repo,state:'open',per_page:100});
            // Public app demand (#321): votes only. Read failures just mean no reordering this pass.
            let demand=[];
            try{demand=publicDemand(await github.paginate(github.rest.issues.listComments,{...context.repo,issue_number:DEMAND_ISSUE,per_page:100}));}
            catch(e){core.warning('Public demand unavailable: '+e.message);}
            require('fs').writeFileSync('demand.json',JSON.stringify(demand));
            const deck=requestedDeck(openIssues,demand);
            require('fs').writeFileSync('requested.txt',deck);
            core.info('Cards to classify (owner selections + top public demand): '+deck.split('\n').filter(Boolean).length);
      - name: Cardkit coverage with verified open-PR claims
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -C base rev-parse HEAD > base-sha.txt
          (cd base && python3 -I tools/cardkit/cardkit.py gaps --claims-from-github --json-output ../gaps.json > /dev/null)
          # The precon run only covers the six precon decks. Classify the owner's own requests too, so a
          # requested card outside those decks can reach Copilot, or be routed to GPT when it cannot.
          # Fails soft: without this file the requested cards are simply reported as unclassified.
          if [ -s requested.txt ]; then
            # The committed Oracle cache lacks most newly requested cards, and an uncached card can
            # only classify as NEEDS_REVIEW. Fetch their Oracle text into this read-only checkout
            # (never committed). On failure they simply stay NEEDS_REVIEW, as before.
            (cd base && python3 -I tools/cardkit/cardkit.py oracle fetch --deck ../requested.txt) \
              || echo '::warning::Oracle fetch for requested cards incomplete; uncached cards stay NEEDS_REVIEW.'
            (cd base && python3 -I tools/cardkit/cardkit.py gaps --claims-from-github --deck ../requested.txt --json-output ../requested-gaps.json > /dev/null) \
              || { echo '::warning::Owner-requested cards could not be classified; they stay unclassified this pass.'; rm -f requested-gaps.json; }
          fi
      - name: Pick unqueued Copilot-ready cards (trusted main code)
        uses: actions/github-script@v7
        env:
          ARCANA_READ_TOKEN: ${{ github.event_name != 'pull_request' && secrets.ARCANA_READ_TOKEN || '' }}
        with:
          script: |
            try { require('./ctl/scripts/gh-etag-cache.cjs').install(github, { core }); } catch (e) { core.info('GitHub API ETag cache unavailable: ' + e.message); }
            const fs=require('fs');const {candidates}=require('./ctl/scripts/queue-feeder.cjs');
            const max=Math.min(5,Math.max(1,Number(context.payload.inputs?.max||3)||3));
            const openIssues=await github.paginate(github.rest.issues.listForRepo,{...context.repo,state:'open',per_page:100});
            let requestedGaps=null;
            try{if(fs.existsSync('requested-gaps.json'))requestedGaps=JSON.parse(fs.readFileSync('requested-gaps.json','utf8'));}catch(e){core.warning('Requested-card classification unreadable: '+e.message);}
            let demand=[];try{demand=JSON.parse(fs.readFileSync('demand.json','utf8'));}catch(e){core.warning('No public demand: '+e.message);}
            const r=candidates({gaps:JSON.parse(fs.readFileSync('gaps.json','utf8')),requestedGaps,openIssues,demand,max});
            fs.writeFileSync('pick.json',JSON.stringify(r));fs.writeFileSync('names.txt',r.names.join('\n')+(r.names.length?'\n':''));
            core.info(JSON.stringify(r));
      - name: Generate queue bodies (cardkit unit, fails closed per card)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          mkdir -p units
          i=0
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            i=$((i+1))
            printf '%s' "$name" > "units/$i.name"
            (cd base && python3 -I tools/cardkit/cardkit.py unit -- "$name") > "units/$i.body" 2> "units/$i.err" || rm -f "units/$i.body"
            # The trusted feeder can reach Scryfall, while Copilot's isolated coding
            # sandbox often cannot. Pass the exact offline record Cardkit just used
            # along with the queue unit; reject units lacking a matching record.
            # This changes only the issue body, not eligibility or paid dispatch.
            if [ -f "units/$i.body" ]; then
              if ! (cd base && python3 -I tools/cardkit/cardkit.py oracle show -- "$name") > "units/$i.oracle" 2> "units/$i.oracle.err" ||
                 ! node ctl/scripts/oracle-handoff.cjs "units/$i.body" "units/$i.oracle" "$name"; then
                echo "::warning::No verified offline Oracle handoff for $name; refusing queue unit."
                rm -f "units/$i.body"
              fi
            fi
          done < names.txt
      - name: Offline Oracle records for prioritized card work (trusted cache, read-only)
        run: |
          set -uo pipefail
          mkdir -p work
          node -e "const r=require('./pick.json');const Q=require('./ctl/scripts/queue-feeder.cjs');(r.workRequests||[]).slice().sort((a,b)=>Q.priorityScore(b)-Q.priorityScore(a)).slice(0,150).forEach((w,i)=>require('fs').writeFileSync('work/'+i+'.name',w.name));"
          for f in work/*.name; do
            [ -f "$f" ] || continue
            k="${f%.name}"; name="$(cat "$f")"
            (cd base && python3 -I tools/cardkit/cardkit.py oracle show -- "$name") > "$k.raw" 2>/dev/null || rm -f "$k.raw"
            if [ -f "$k.raw" ] && ! node -e "const {oracleSnapshot}=require('./ctl/scripts/oracle-handoff.cjs');const fs=require('fs');fs.writeFileSync(process.argv[2],oracleSnapshot(fs.readFileSync(process.argv[1],'utf8'),process.argv[3]))" "$k.raw" "$k.jsonl" "$name"; then
              echo "::warning::No verified Oracle record for card work $name; it will not be auto-started."
            fi
          done
      - id: pick
        name: Assemble suggestions (trusted main code)
        uses: actions/github-script@v7
        env:
          ARCANA_READ_TOKEN: ${{ github.event_name != 'pull_request' && secrets.ARCANA_READ_TOKEN || '' }}
        with:
          script: |
            try { require('./ctl/scripts/gh-etag-cache.cjs').install(github, { core }); } catch (e) { core.info('GitHub API ETag cache unavailable: ' + e.message); }
            const fs=require('fs');const r=JSON.parse(fs.readFileSync('pick.json','utf8'));
            const units=fs.readdirSync('units').filter(f=>f.endsWith('.name')).sort((a,b)=>parseInt(a)-parseInt(b)).map(f=>{
              const k=f.slice(0,-5),body=fs.existsSync('units/'+k+'.body')?fs.readFileSync('units/'+k+'.body','utf8'):null;
              return {name:fs.readFileSync('units/'+f,'utf8'),body,error:body?null:(fs.readFileSync('units/'+k+'.err','utf8').split('\n')[0]||'refused')};});
            const oracleFor=new Map((fs.existsSync('work')?fs.readdirSync('work'):[]).filter(f=>f.endsWith('.jsonl')).map(f=>[fs.readFileSync('work/'+f.slice(0,-6)+'.name','utf8'),fs.readFileSync('work/'+f,'utf8')]));
            const workRequests=(r.workRequests||[]).map(w=>oracleFor.has(w.name)?{...w,oracle:oracleFor.get(w.name)}:w);
            fs.writeFileSync('feeder-result.json',JSON.stringify({...r,workRequests,units,baseSha:fs.readFileSync('base-sha.txt','utf8').trim()}));
      - name: Upload feeder result for publishing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arcana-queue-feeder-result
          path: feeder-result.json
          if-no-files-found: error
          retention-days: 1
      - name: Save GitHub API ETag cache
        if: always() && hashFiles('.gh-etag-cache/cache.json.gz') != ''
        uses: actions/cache/save@v4
        with:
          path: .gh-etag-cache
          key: gh-etag-v1-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
  publish:
    needs: suggest
    if: >-
      ${{ !cancelled() && vars.ARCANA_INTEGRATION_BASE != '' &&
      (github.event_name != 'pull_request_target' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'Copilot' &&
      github.event.pull_request.base.ref == vars.ARCANA_INTEGRATION_BASE &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: write
      pull-requests: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && 'main' || github.workflow_sha }}
          persist-credentials: false
      - name: Download feeder result
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: arcana-queue-feeder-result
      - name: Restore GitHub API ETag cache (304 Not Modified does not count against the API quota)
        uses: actions/cache/restore@v4
        with:
          path: .gh-etag-cache
          key: gh-etag-v1-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          restore-keys: gh-etag-v1-
      - uses: actions/github-script@v7
        env:
          ARCANA_READ_TOKEN: ${{ github.event_name != 'pull_request' && secrets.ARCANA_READ_TOKEN || '' }}
          ARCANA_INTEGRATION_BASE: ${{ vars.ARCANA_INTEGRATION_BASE }}
          ARCANA_AUTOMATION_READY: ${{ vars.ARCANA_AUTOMATION_READY }}
          ARCANA_DISPATCH_MODE: ${{ vars.ARCANA_DISPATCH_MODE }}
        with:
          script: |
            try { require('./scripts/gh-etag-cache.cjs').install(github, { core }); } catch (e) { core.info('GitHub API ETag cache unavailable: ' + e.message); }
            const Q=require('./scripts/queue-feeder.cjs');const S=require('./scripts/control-status.cjs');
            let r=null;try{r=JSON.parse(require('fs').readFileSync('feeder-result.json','utf8'));}catch(e){core.warning('Feeder result unavailable: '+e.message);}
            const result=r||{ok:false,reason:'feeder job produced no result (see the suggest job)'};
            let payload=Q.queuePayload({result,units:r?.units||[],base:process.env.ARCANA_INTEGRATION_BASE,baseSha:r?.baseSha,runId:context.runId});
            const enabled=process.env.ARCANA_AUTOMATION_READY==='true' && process.env.ARCANA_DISPATCH_MODE==='normal';
            const previous=await S.previousStatus({github,...context.repo,kind:'queue'});
            const auto=await Q.createNextAutoQueue({github,...context.repo,payload,runId:context.runId,enabled});
            payload.autoQueue=auto;
            // Blocked owner/app requests -> one prioritized [Card Work] item per pass; resolved ones handed back. Never paid here.
            try{payload.cardWork=await Q.syncCardWork({github,...context.repo,payload,runId:context.runId,enabled});}
            catch(e){payload.cardWork={reason:'card-work-sync-failed'};core.warning('Card work sync failed: '+e.message);}
            // Oracle records live in the card-work issues; keep the status comment small.
            payload.workRequests=(payload.workRequests||[]).map(({oracle,...w})=>({...w,oracle:!!oracle}));
            // Stay well under GitHub's 65,536-character comment limit.
            while(S.formatStatus('queue',payload,Q.queueSummary(payload)).length>60000&&payload.suggestions.length)payload={...payload,suggestions:payload.suggestions.slice(0,-1)};
            const published=await S.publishStatus({github,...context.repo,kind:'queue',payload,summary:Q.queueSummary(payload)});
            core.info('Status comment: '+published);
            await core.summary.addHeading('Queue feeder').addRaw(Q.queueSummary(payload).join('\n')).write();
            if(!r||published.startsWith('failed')){core.setFailed('Queue status not published ('+published+').');return;}
            if(auto.created||auto.pending)await github.rest.actions.createWorkflowDispatch({...context.repo,workflow_id:'arcana-card-dispatcher.yml',ref:'main',inputs:{dry_run:'false'}});
            // Owner card-review inbox for the app (read-only; approving happens on GitHub). Never blocks the feeder.
            // The dedicated inbox-refresh and integration workflows always rebuild it; here only when stale,
            // since each rebuild reads every open card PR against the shared hourly API quota.
            try{if(await S.freshStatus({github,...context.repo,kind:'review',maxAgeMs:5*60*1000}))core.info('Review inbox fresh; rebuild skipped.');
              else{const R=require('./scripts/review-inbox.cjs');const inbox=await R.buildReviewInbox({github,...context.repo});
              core.info('Review inbox: '+await S.publishStatus({github,...context.repo,kind:'review',payload:inbox,summary:R.inboxSummary(inbox)}));}}
            catch(e){core.warning('Review inbox not published: '+e.message);}
            // The card picker's deck/library data is built at Pages deploy time; rebuild it when the base moves.
            if(Q.needsSiteRefresh(previous,payload)){
              try{await github.rest.actions.createWorkflowDispatch({...context.repo,workflow_id:'pages.yml',ref:'main'});core.info('Integration base moved; control site refresh requested.');}
              catch(e){core.warning('Control site refresh not requested: '+e.message);}
            }
      - name: Save GitHub API ETag cache
        if: always() && hashFiles('.gh-etag-cache/cache.json.gz') != ''
        uses: actions/cache/save@v4
        with:
          path: .gh-etag-cache
          key: gh-etag-v1-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
