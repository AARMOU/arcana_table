name: Build 127 no-compromise engine profiling
on:
  push:
    branches:
      - gpt/engine-delay-127-investigation
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build127-profiling-${{ github.ref }}
  cancel-in-progress: true
jobs:
  endstep-ai-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Run AI-vs-pass baseline on real 200-trigger cascade
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --no-daemon --max-workers=2 :custom-cards:test --tests '*AiEndStepCascadeProfileTest' --info 2>&1 | tee ../build127-ai.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build127-ai-endstep-profile
          path: |
            build127-ai.log
            android/custom-cards/build/test-results/test/
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Confirm AI and auto-pass regression behavior
        working-directory: android
        run: |
          ./gradlew --no-daemon --max-workers=2 :custom-cards:test --tests '*OfflineHumanAutoPassParityTest' --tests '*OfflineAiLargeBoardTest' --tests '*AiRetargetingSearchTest'
      - name: Compile Android host and existing functional tests
        working-directory: android
        run: |
          ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest --tests '*LocalArgentumHostTest' --tests '*OfflineLagFixTest'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build127-regressions
          path: |
            android/custom-cards/build/test-results/test/
            android/app/build/test-results/
