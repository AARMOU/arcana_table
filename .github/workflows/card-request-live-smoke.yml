name: Card Request live service smoke (read-only)
on:
  pull_request:
    paths:
      - '.github/workflows/card-request-live-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-live-endpoint:
    name: Verify deployed Worker health and invalid-input rejection
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check public health response (no credentials)
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://arcana-card-requests.arcanamtg.workers.dev'
          health_file="$RUNNER_TEMP/card-request-health.json"
          status=$(curl --silent --show-error --retry 2 --max-time 15 \
            --proto '=https' \
            -o "$health_file" -w '%{http_code}' "$endpoint/health")
          test "$status" = "200" || { echo "::error::Worker /health returned HTTP $status"; exit 1; }
          python3 - "$health_file" <<'PY'
          import json,sys
          with open(sys.argv[1], encoding='utf-8') as f:
              reply=json.load(f)
          assert reply == {"ok": True, "service": "arcana-card-requests", "protocol": 1}, reply
          print("PASS: deployed Worker /health returns the expected service and protocol")
          PY
      - name: Verify invalid JSON cannot enqueue a public card request
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://arcana-card-requests.arcanamtg.workers.dev/v1/card-requests'
          response_file="$RUNNER_TEMP/card-request-rejection.json"
          status=$(curl --silent --show-error --retry 2 --max-time 15 \
            --proto '=https' \
            -H 'Content-Type: application/json' -X POST --data-binary '{' \
            -o "$response_file" -w '%{http_code}' "$endpoint")
          test "$status" = "400" || { echo "::error::Malformed JSON returned HTTP $status instead of 400"; exit 1; }
          python3 - "$response_file" <<'PY'
          import json,sys
          with open(sys.argv[1], encoding='utf-8') as f:
              reply=json.load(f)
          assert reply == {"error": "Invalid JSON"}, reply
          print("PASS: live intake rejects malformed JSON before writing to GitHub")
          PY
      - name: Diagnose machine-client POST edge handling without recording a card
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,urllib.error
          endpoint="https://arcana-card-requests.arcanamtg.workers.dev/v1/card-requests"
          agents=[
            ("python-urllib-default",None),
            ("android-dalvik","Dalvik/2.1.0 (Linux; U; Android 17; Arcana Table)"),
            ("arcana-client","ArcanaTable-CardRequests/1.0"),
          ]
          results={}
          for label,agent in agents:
              headers={"Content-Type":"application/json","Accept":"application/json"}
              if agent: headers["User-Agent"]=agent
              request=urllib.request.Request(endpoint,data=b"{",headers=headers,method="POST")
              try:
                  with urllib.request.urlopen(request,timeout=15) as response:
                      status=response.status
                      server=response.headers.get("server","")
                      body=response.read(500).decode("utf-8","replace")
              except urllib.error.HTTPError as error:
                  status=error.code
                  server=error.headers.get("server","")
                  body=error.read(500).decode("utf-8","replace")
              print(f"agent={label} status={status} server={server} body={body[:160]!r}")
              results[label]=status
          assert results["android-dalvik"]==400, "Mobile POST is blocked before JSON validation"
          assert results["arcana-client"]==400, "Explicit app POST is blocked before JSON validation"
          PY
