name: Arcana Card Review Inbox Refresh
# Independent of the queue feeder. Read-only on cards, no dispatcher, credit
# budget, approval, or worker launch. Only updates one public review-status comment.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_run:
    workflows: ['Arcana Independent Card Certification']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arcana-review-inbox-refresh
  cancel-in-progress: false

jobs:
  # Certification runs after every Cardkit/Development CI completion on any PR. Only a run that published a
  # result can change the inbox; a full rebuild reads every open card PR (~150 calls) against the shared
  # 1,000/hour GITHUB_TOKEN quota. A separate gate job lets Approved Card Integration (which runs on this
  # workflow's completion) see whether the review job really ran, and skip its own ~150-call plan if not.
  gate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      rebuild: ${{ steps.gate.outputs.rebuild }}
    steps:
      - id: gate
        uses: actions/github-script@v7
        with:
          script: |
            let rebuild = true;
            if (context.eventName === 'workflow_run') {
              const jobs = (await github.rest.actions.listJobsForWorkflowRun({...context.repo,
                run_id: context.payload.workflow_run.id, per_page: 100})).data.jobs || [];
              rebuild = jobs.some(j => j.name.startsWith('Publish exact-head') && j.conclusion && j.conclusion !== 'skipped');
              if (!rebuild) core.info('Certification run published nothing; inbox rebuild skipped.');
            }
            core.setOutput('rebuild', rebuild ? 'true' : 'false');

  review:
    name: Publish independently verified card review status
    needs: gate
    if: needs.gate.outputs.rebuild == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pull-requests: read
      issues: write
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Restore GitHub API ETag cache (304 Not Modified does not count against the API quota)
        uses: actions/cache/restore@v4
        with:
          path: .gh-etag-cache
          key: gh-etag-v1-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          restore-keys: gh-etag-v1-
      - name: Build exact-head review inbox and update issue 78
        uses: actions/github-script@v7
        with:
          script: |
            try { require('./scripts/gh-etag-cache.cjs').install(github, { core }); } catch (e) { core.info('GitHub API ETag cache unavailable: ' + e.message); }
            const R = require('./scripts/review-inbox.cjs');
            const S = require('./scripts/control-status.cjs');
            const payload = await R.buildReviewInbox({github, ...context.repo});
            const result = await S.publishStatus({github, ...context.repo,
              kind:'review',payload,summary:R.inboxSummary(payload)});
            core.info('Review inbox published: ' + result);
            core.info('Ready for owner review: ' + payload.awaitingReview);
            // Mention the owner on #78 only when a card newly becomes ready to Verify.
            core.info('Ready alert: ' + await R.alertReady({github, ...context.repo, payload}));
            try { core.info('Stalls: ' + await R.reportStalls({github, ...context.repo, payload})); }
            catch (error) { core.warning('Stall report unavailable: ' + String(error?.message || error).slice(0, 200)); }
            try { core.info('Engine versions: ' + await require('./scripts/engine-watch.cjs').reportUpstream({github, ...context.repo})); }
            catch (error) { core.warning('Engine version note unavailable: ' + String(error?.message || error).slice(0, 200)); }
            // Explain owner-approved cards that integration skips (e.g. a non-card file in the PR).
            try { core.info('Integration skips: ' + await require('./scripts/card-integration.cjs').reportIntegrationSkips({github, ...context.repo})); }
            catch (error) { core.warning('Integration skip report unavailable: ' + String(error?.message || error).slice(0, 200)); }
            if (result.startsWith('failed')) core.setFailed('Review inbox status publication failed: ' + result);
      - name: Save GitHub API ETag cache
        if: always() && hashFiles('.gh-etag-cache/cache.json.gz') != ''
        uses: actions/cache/save@v4
        with:
          path: .gh-etag-cache
          key: gh-etag-v1-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
