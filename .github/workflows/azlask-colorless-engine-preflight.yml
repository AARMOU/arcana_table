name: Azlask exact colorless death pinned-engine preflight
# Read-only source-built temporary runtime, never commit/replace Arcana JARs or enable card assets.
on:
  push:
    branches: [gpt/azlask-complete-oracle-20261025]
    paths:
      - 'engine-upgrade/azlask/**'
      - '.github/workflows/azlask-colorless-engine-preflight.yml'
  pull_request:
    branches: [gpt/arcana-integration-next]
    paths:
      - 'engine-upgrade/azlask/**'
      - '.github/workflows/azlask-colorless-engine-preflight.yml'
permissions:
  contents: read
concurrency:
  group: azlask-pinned-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  azlask-source-test:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: wingedsheep/argentum-engine
          ref: 61e71e586b100faa661f86cac827ac3c3bbb5a78
          path: argentum-engine
          persist-credentials: false
      - name: Enforce pinned source and apply all mandatory Arcana engine patches before Azlask
        run: |
          set -euo pipefail
          test "$(git -C argentum-engine rev-parse HEAD)" = 61e71e586b100faa661f86cac827ac3c3bbb5a78
          # Baseline Arcana fixes are REQUIRED for copy-trigger/legend-rule behavior.
          # This is the exact same ordered mandatory series used by the integrated upgrade audit,
          # including selected forward ports. The audit refuses missing or conflicting patches.
          python3 engine-upgrade/audit_patches.py
          file="$GITHUB_WORKSPACE/engine-upgrade/azlask/patches/0001-exactly-colors-death-lki.patch"
          git -C argentum-engine apply --check "$file"
          git -C argentum-engine apply "$file"
          git -C argentum-engine diff --check
          git -C argentum-engine diff --stat
      - name: Compile disposable Argentum source for Android's Java 17 bytecode
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("argentum-engine/buildSrc/src/main/kotlin/kotlin-jvm.gradle.kts")
          raw = p.read_text()
          assert raw.count("jvmToolchain(21)") == 1, "unexpected upstream convention: fail closed"
          p.write_text(raw.replace("jvmToolchain(21)", "jvmToolchain(17)", 1))
          print("Disposable engine module toolchain: Java 17; upstream pin unchanged")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile patched pinned engine and SDK, no production files
        working-directory: argentum-engine
        run: |
          ./scripts/gradle-locked --no-daemon --max-workers=2 -PkotlinCompileParallelism=1 -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m' :mtg-sdk:jar :mtg-sdk-tooling:jar :rules-engine:jar
      - name: Inject temporary verified jars only on this runner
        run: |
          python3 - <<'PY'
          import hashlib, shutil, zipfile, struct
          from pathlib import Path
          libs=Path("android/app/libs")
          # Preserve the Arcana-pinned AI JAR: source-upstream AI lacks the app's
          # RetargetingCandidateFilter. We are testing an engine patch, NOT an AI upgrade.
          ai=libs/"argentum-ai.jar"
          assert ai.is_file(), "Arcana-pinned AI JAR missing"
          ai_hash=hashlib.sha256(ai.read_bytes()).hexdigest()
          with zipfile.ZipFile(ai) as pinned_ai:
              assert "com/wingedsheep/ai/engine/RetargetingCandidateFilter.class" in pinned_ai.namelist(), (
                  "Arcana AI extension missing: fail closed before compiling tests"
              )
          markers={"mtg-sdk":"com/wingedsheep/sdk/model/CardDefinition.class",
                   "mtg-sdk-tooling":"com/wingedsheep/sdk/tooling/CardLoader.class",
                   "rules-engine":"com/wingedsheep/engine/core/GameAction.class"}
          for module, identifier in markers.items():
              jars=[f for f in Path(f"argentum-engine/{module}/build/libs").glob("*.jar")
                    if "sources" not in f.name and "javadoc" not in f.name
                    and identifier in zipfile.ZipFile(f).namelist()]
              assert len(jars)==1,(module,jars)
              target=libs/f"argentum-{module}.jar"
              shutil.copyfile(jars[0],target)
              with zipfile.ZipFile(target) as z:
                  versions=[struct.unpack(">H",z.read(n)[6:8])[0] for n in z.namelist() if n.endswith(".class")]
              assert versions and max(versions)<=61,(module,max(versions))
              print("temporary runner-only",target,hashlib.sha256(target.read_bytes()).hexdigest())
          assert hashlib.sha256(ai.read_bytes()).hexdigest()==ai_hash, "Unexpected AI JAR change"
          print("kept Arcana-pinned AI JAR:", ai_hash)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Run three strict Azlask engine scenarios on temporary source-built runtime
        working-directory: android
        run: |
          ./gradlew --no-daemon --max-workers=2 :custom-cards:test --tests 'com.arcanatable.customcards.AzlaskTheSwellingScourgeScenarioTest'
      - name: Enforce all three executed with zero failure/skip
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          items=list(Path("android/custom-cards/build/test-results/test").glob("TEST-*AzlaskTheSwellingScourgeScenarioTest.xml"))
          assert len(items)==1,f"Expected exactly one Azlask XML report; got {items}"
          root=ET.parse(items[0]).getroot()
          counts={key:int(root.get(key,0)) for key in ("tests","failures","errors","skipped")}
          print("Azlask strict engine tests:",counts)
          assert counts["tests"] >= 3
          assert counts["failures"] == counts["errors"] == counts["skipped"] == 0
          PY
      - name: Register Azlask ONLY in disposable runner workspace
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/custom-cards/src/main/kotlin/com/arcanatable/customcards/CustomCards.kt")
          s = p.read_text()
          marker = "        // Eldrazi Incursion.\n"
          assert s.count(marker) == 1, "Registry changed, fail closed"
          assert "Entry(AzlaskTheSwellingScourge," not in s, "Already registered in source; review before retry"
          p.write_text(s.replace(marker, marker + '        Entry(AzlaskTheSwellingScourge, "M3C", "Eldrazi Incursion"),\n'))
          print("Runner only: registered Azlask in CustomCards.kt (not committed)")
          PY
      - name: Export runner-only Azlask card and validate exact names
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 :custom-cards:exportCards
          python3 - <<'PY'
          import json
          from pathlib import Path
          assets = Path("app/src/main/assets/argentum")
          names = [x.split("\t")[0] for x in (assets/"custom-cards.index.tsv").read_text().splitlines() if x.strip()]
          exported = [json.loads(x)["name"] for x in (assets/"custom-cards.jsonl").read_text().splitlines() if x.strip()]
          assert names == exported, "Index/export mismatch"
          assert names.count("Azlask, the Swelling Scourge") == 1, "Missing or duplicate Azlask definition"
          assert len(names) == len({n.casefold() for n in names}), "Duplicate names in registry"
          print(f"Runner-only index consistent: {len(names)} exported definitions, exactly one Azlask")
          PY
      - name: Run full custom-card and Android debug unit tests against patched engine
        working-directory: android
        run: |
          ./gradlew --no-daemon --max-workers=2 :custom-cards:test :app:testDebugUnitTest
      - name: Enforce complete suite XML, fail on all unknown skips
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          # These four pre-existing @Assume opt-in integrations need external services:
          # OnlineRelayTest: ARCANA_RELAY_URL; LiveArgentumGameTest: -Pargentum.live=true.
          # Verified by exact XML from run 40236493110 and each test's source guards.
          known_opt_in = {
              ("com.arcanatable.OnlineRelayTest", "droppedPhonesReconnectAndCatchUp"),
              ("com.arcanatable.OnlineRelayTest", "hostAndGuestTalkThroughTheRelay"),
              ("com.arcanatable.ui.LiveArgentumGameTest", "unsupportedCardOpensReviewAndSandboxFallback"),
              ("com.arcanatable.ui.LiveArgentumGameTest", "playRealArgentumGameThroughArcanaUi"),
          }
          for label, location, minimum in [
              ("custom", Path("android/custom-cards/build/test-results/test"), 460),
              ("android", Path("android/app/build/test-results/testDebugUnitTest"), 301),
          ]:
              files = list(location.glob("TEST-*.xml"))
              assert files, f"{label}: no test XML found"
              totals = {key: 0 for key in ("tests", "failures", "errors", "skipped")}
              actual_skips = set()
              for path in files:
                  suite = ET.parse(path).getroot()
                  for key in totals:
                      totals[key] += int(suite.get(key, 0))
                  for case in suite.findall(".//testcase"):
                      if case.find("skipped") is not None:
                          actual_skips.add((case.get("classname", ""), case.get("name", "")))
              print(f"{label}: {totals}, known opt-in skips: {sorted(actual_skips)}")
              assert totals["tests"] >= minimum, f"{label}: unexpectedly fewer tests than verified baseline"
              assert totals["failures"] == totals["errors"] == 0, f"{label}: failed/error tests"
              assert totals["skipped"] == len(actual_skips), f"{label}: unaccounted or duplicate skip"
              if label == "custom":
                  assert not actual_skips, "No custom-card test may be skipped"
              else:
                  assert actual_skips <= known_opt_in, (
                      f"Unexpected Android skips: {sorted(actual_skips - known_opt_in)}"
                  )
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: azlask-pinned-engine-source-evidence
          retention-days: 14
          path: |
            android/custom-cards/build/test-results/test/TEST-*.xml
            android/app/build/test-results/testDebugUnitTest/TEST-*.xml
            android/app/src/main/assets/argentum/custom-cards.index.tsv
