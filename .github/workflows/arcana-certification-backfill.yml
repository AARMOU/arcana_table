name: Arcana Certification Backfill
# Certification runs only when a card PR's Cardkit/Development CI completes. A suite that
# merges after that CI would otherwise wait for a manual re-run. After any certification
# change on main, re-run the latest successful CI of each open card PR that has a registered
# suite but no certification check yet; that completion triggers the normal certification
# workflow. Hourly, it also retries once a card PR's CI that failed with no green run on its
# head (infrastructure failures), and lists on #81 card PRs with card code but no registered
# suite so suite authors pick them up. Never certifies, approves, merges or dispatches anything itself.
on:
  push:
    branches: [main]
    paths:
      - 'certification/**'
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
    inputs:
      scheduled:
        description: 'Timer run (Arcana Control Worker): only retry failures, never re-run green CI'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: arcana-certification-backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: write
      # write: posts the missing-suite note on #81, only when its list changes.
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Restore GitHub API ETag cache (304 Not Modified does not count against the API quota)
        uses: actions/cache/restore@v4
        with:
          path: .gh-etag-cache
          key: gh-etag-v1-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          restore-keys: gh-etag-v1-
      - uses: actions/github-script@v7
        env:
          ARCANA_READ_TOKEN: ${{ github.event_name != 'pull_request' && secrets.ARCANA_READ_TOKEN || '' }}
        with:
          script: |
            try { require('./scripts/gh-etag-cache.cjs').install(github, { core }); } catch (e) { core.info('GitHub API ETag cache unavailable: ' + e.message); }
            const { backfill } = require('./certification/backfill.cjs');
            const r = await backfill({ github, ...context.repo, root: '.', scheduled: context.eventName === 'schedule' || context.payload.inputs?.scheduled === 'true' || context.payload.inputs?.scheduled === true, report: true });
            core.info(JSON.stringify(r));
            await core.summary.addHeading('Certification backfill').addCodeBlock(JSON.stringify(r, null, 1)).write();
            // Idle-time work (owner, 2026-11-01, cap 6/day; owner burst window in certification/idle-burst.json): one suite request for an integrated card when the
            // dispatcher has nothing eligible. Never assigns or spends; the dispatcher does that, after all other work.
            try {
              const P = require('./certification/policy.cjs');
              const { requestIdleSuite } = require('./certification/idle-suites.cjs');
              const idle = await requestIdleSuite({ github, ...context.repo, root: '.', manifest: P.readManifest('./certification/suites.json') });
              core.info('Idle suite: ' + JSON.stringify(idle));
              // New requests are unlabeled issues, which do not start the dispatcher: start it now so they are picked up.
              if (idle.requested) await github.rest.actions.createWorkflowDispatch({ ...context.repo, workflow_id: 'arcana-card-dispatcher.yml', ref: 'main', inputs: { dry_run: 'false' } });
              await core.summary.addHeading('Idle suite request').addCodeBlock(JSON.stringify(idle, null, 1)).write();
            } catch (e) { core.warning('Idle suite request skipped: ' + String(e?.message || e).slice(0, 300)); }
      - name: Save GitHub API ETag cache
        if: always() && hashFiles('.gh-etag-cache/cache.json.gz') != ''
        uses: actions/cache/save@v4
        with:
          path: .gh-etag-cache
          key: gh-etag-v1-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
