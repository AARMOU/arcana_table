name: Stop superseded integration validation (NO APK)
on:
  push:
    branches: [gpt/integration-comment-scope-smoke-20261028]
permissions:
  contents: read
  actions: write
jobs:
  stop-superseded-read-only-run:
    if: github.repository == 'AARMOU/arcana_table'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run_id=40816705613;
            const run=(await github.rest.actions.getWorkflowRun({...context.repo,run_id})).data;
            if(run.name!=='Arcana Approved Card Integration (NO APK)' ||
               run.head_sha!=='0aed4fb070b45d52bbede71a9779e2b0506c6183' || run.event!=='push')
              throw Error('Refusing cancellation: unexpected workflow/source');
            if(run.status==='completed'){core.info('Superseded run already finished; nothing cancelled');return;}
            const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{...context.repo,run_id,per_page:100});
            if(jobs.some(j=>j.name==='publish'&&j.status==='in_progress'))
              throw Error('Refusing cancellation: publisher is active');
            await github.rest.actions.cancelWorkflowRun({...context.repo,run_id});
            core.info('Cancelled only superseded read-only integration validation '+run_id+'; corrected main run can proceed.');
