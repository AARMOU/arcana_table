name: Rules reliability baseline (Build 131)

on:
  push:
    branches:
      - gpt/rules-reliability-b131-20261022
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK command-line tools
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/android-sdk}}"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/commandlinetools.zip" \
            "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip"
          unzip -q "$RUNNER_TEMP/commandlinetools.zip" -d "$RUNNER_TEMP/android-cli"
          mv "$RUNNER_TEMP/android-cli/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --version
          "$SDKMANAGER" --licenses < <(yes || true) >/dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Execute real regression baseline
        run: bash scripts/run-rules-reliability-baseline.sh
      - name: Upload test reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rules-reliability-baseline-${{ github.run_id }}
          path: |
            android/app/build/test-results/
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-*
            android/custom-cards/build/test-results/
            android/custom-cards/build/reports/tests/
          if-no-files-found: warn
