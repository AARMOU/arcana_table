name: Eldrazi 91-slot fail-closed offline AI smoke

on:
  push:
    branches:
      - gpt/eldrazi-91-slot-failclosed-offline-smoke-20261025
  pull_request:
    branches:
      - gpt/eldrazi-91-slot-apk-inventory-gate-20261025
    paths:
      - android/app/src/test/java/com/arcanatable/EldraziIncursionPlayableTest.kt
      - .github/workflows/eldrazi-91-slot-offline-smoke.yml

permissions:
  contents: read

concurrency:
  group: eldrazi-91-offline-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-precon-offline-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Regenerate candidate custom-card assets in runner
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 :custom-cards:exportCards
      - name: Execute real original-deck inventory, registration and AI-mirror tests
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest --tests 'com.arcanatable.EldraziIncursionPlayableTest'
      - name: Assert three Eldrazi test cases executed, without skips
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path('android/app/build/test-results/testDebugUnitTest')
          files = sorted(root.rglob('*.xml')) if root.is_dir() else []
          cases = []
          for file in files:
              suite = ET.parse(file).getroot()
              for case in suite.iter('testcase'):
                  if case.attrib.get('classname', '').endswith('EldraziIncursionPlayableTest'):
                      cases.append((file, case))
          names = sorted(case.attrib.get('name') for _, case in cases)
          expected = [
              'incursionMirrorAiGame',
              'newlyImplementedCardsLoadIntoTheOfflineGame',
              'originalSlotIndexInventoryMatchesTheExplicitMissingList',
          ]
          assert names == expected, f'expected all three executed Eldrazi cases; observed {names}'
          for file, case in cases:
              assert not any(case.find(tag) is not None for tag in ('skipped', 'failure', 'error')), (file, case.attrib)
          print('PASS: three mandatory Eldrazi original-deck cases executed; no skips, failures or errors')
          PY
      - name: Upload unfiltered Android JUnit and test console results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eldrazi-91-failclosed-android-evidence
          retention-days: 14
          path: |
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/tests/testDebugUnitTest/
