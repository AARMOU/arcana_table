name: Engine delay Build 124 preview APK (unsigned CI)
on:
  push:
    branches:
      - gpt/engine-delay-apk-build
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify preview version
        run: |
          grep -F 'applicationId = "com.arcanatable"' android/app/build.gradle.kts
          grep -F 'versionCode = 124' android/app/build.gradle.kts
          grep -F 'versionName = "0.33.2-build124-preview"' android/app/build.gradle.kts
      - name: Compile unsigned release APK using pinned bundled Build 123 engine
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleRelease
      - name: Stage unsigned APK and offline signing tools
        run: |
          set -euo pipefail
          mkdir -p preview
          cp android/app/build/outputs/apk/release/*.apk preview/ArcanaTable-build124-engine-delay-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" preview/apksigner.jar
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" preview/zipalign
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging preview/ArcanaTable-build124-engine-delay-unsigned.apk | head -n 8 > preview/package-info.txt
          sha256sum preview/ArcanaTable-build124-engine-delay-unsigned.apk > preview/SHA256SUMS.txt
          printf 'branch=gpt/engine-delay-apk-build\ncommit=%s\nengine=pinned Build 123 jars\nci_signed=false\n' "$GITHUB_SHA" > preview/source.txt
      - uses: actions/upload-artifact@v4
        with:
          name: arcana-engine-delay-build124-unsigned
          path: preview/
          retention-days: 7
