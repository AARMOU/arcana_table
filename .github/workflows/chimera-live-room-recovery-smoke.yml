name: One-shot live Chimera room recovery smoke (postdeploy)
on:
  push:
    branches:
      - gluece/chimera-cloudflare-credential-check-20261111
    paths:
      - '.github/workflows/chimera-live-room-recovery-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    if: >-
      github.repository == 'AARMOU/arcana_table' &&
      github.ref == 'refs/heads/gluece/chimera-cloudflare-credential-check-20261111' &&
      github.event.head_commit.message == 'VERIFY: LIVE CHIMERA RECOVERY WORKER 2026-11-11'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check live worker health and secure all-offline recovery in an isolated room
        shell: bash
        env:
          ARCANA_RELAY_TEST_ORIGIN: https://arcana-table-rooms.arcanamtg.workers.dev
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --max-time 15 "$ARCANA_RELAY_TEST_ORIGIN/health" > /dev/null
          git clone --quiet --filter=blob:none --no-checkout https://github.com/AARMOU/arcana-chimera.git chimera
          git -C chimera checkout --quiet --detach 9e12dfc9e24ab1289f64fce0f63ffc15a5011a75
          node chimera/tests/verify-directed-room-all-offline.mjs
          echo 'PASS: deployed production Worker health and private-seat recovery in a unique temporary test room.'
