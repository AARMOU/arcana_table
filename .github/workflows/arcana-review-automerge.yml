name: Arcana Review Auto-merge
# A Copilot review PR answering a prioritized [Card Work] item (opened by the queue feeder, started by the
# dispatcher when no engineer claimed it) merges into the integration base only after a green Arcana Cardkit run
# on its exact head, and only if it is exactly one Cardkit decision for that card (reviewedLines entry or engine
# blocker) plus that card's trusted Oracle cache line. See scripts/review-automerge.cjs. The merge uses a
# person-scoped token so the push starts Development CI, which the dispatcher requires on the base.
on:
  workflow_run:
    workflows: [Arcana Cardkit]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: arcana-review-automerge
  cancel-in-progress: false
jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' && vars.ARCANA_INTEGRATION_BASE != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Restore GitHub API ETag cache (304 Not Modified does not count against the API quota)
        uses: actions/cache/restore@v4
        with:
          path: .gh-etag-cache
          key: gh-etag-v1-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          restore-keys: gh-etag-v1-
      - uses: actions/github-script@v7
        env:
          ARCANA_READ_TOKEN: ${{ github.event_name != 'pull_request' && secrets.ARCANA_READ_TOKEN || '' }}
          MERGE_TOKEN: ${{ secrets.ARCANA_SUITE_MERGE_TOKEN || secrets.COPILOT_DISPATCH_TOKEN }}
          ARCANA_INTEGRATION_BASE: ${{ vars.ARCANA_INTEGRATION_BASE }}
        with:
          script: |
            try { require('./scripts/gh-etag-cache.cjs').install(github, { core }); } catch (e) { core.info('GitHub API ETag cache unavailable: ' + e.message); }
            const { mergeReviewPr } = require('./scripts/review-automerge.cjs');
            const writer = process.env.MERGE_TOKEN ? new github.constructor({ auth: process.env.MERGE_TOKEN }) : github;
            const r = await mergeReviewPr({ github, writer, ...context.repo, run: context.payload.workflow_run,
              base: process.env.ARCANA_INTEGRATION_BASE, core });
            core.info(JSON.stringify(r));
            await core.summary.addHeading('Review auto-merge').addCodeBlock(JSON.stringify(r, null, 1)).write();
            // The next feeder pass re-classifies on the new base: a reviewed card becomes Copilot-ready and is
            // queued, and its card-work item closes. Start it now rather than waiting for the schedule.
            if (r.merged) await github.rest.actions.createWorkflowDispatch({ ...context.repo, workflow_id: 'arcana-queue-feeder.yml', ref: 'main' })
              .catch(e => core.warning('Feeder dispatch failed: ' + e.message));
      - name: Save GitHub API ETag cache
        if: always() && hashFiles('.gh-etag-cache/cache.json.gz') != ''
        uses: actions/cache/save@v4
        with:
          path: .gh-etag-cache
          key: gh-etag-v1-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
