name: Build 123 signing verification tools
on:
  push:
    branches: [gpt/build123-verification-tools]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'build-tools;36.0.0'
      - name: Collect official Android signing and validation tools
        run: |
          mkdir -p signing-tools/lib signing-tools/lib64
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" signing-tools/lib/
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" signing-tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib64/libc++.so" signing-tools/lib64/
          curl --fail --location --retry 2 'https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar' --output signing-tools/bundletool.jar
          sha256sum signing-tools/lib/apksigner.jar signing-tools/zipalign signing-tools/lib64/libc++.so signing-tools/bundletool.jar > signing-tools/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Build123-signing-verification-tools
          path: signing-tools/
