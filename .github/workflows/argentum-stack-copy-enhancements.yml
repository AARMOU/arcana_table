name: Isolated Argentum stack-copy validation
on:
  push:
    branches: [gpt/argentum-six-precons]
    paths:
      - investigation/argentum-six-precons/staged-engine/0004-stack-object-copying.patch
      - .github/workflows/argentum-stack-copy-enhancements.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: argentum-stack-copy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  stack-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ORG_GRADLE_PROJECT_kotlinCompileParallelism: '1'
      GRADLE_OPTS: '-Dorg.gradle.workers.max=2 -Dorg.gradle.configuration-cache=false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: wingedsheep/argentum-engine
          ref: 7a9663d8e4df4ce7db223023ae7714f0028e08a9
          path: upstream-engine
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned just task runner
        run: |
          mkdir -p "$RUNNER_TEMP/just-bin"
          curl -fsSL --retry 3 https://github.com/casey/just/releases/download/1.40.0/just-1.40.0-x86_64-unknown-linux-musl.tar.gz -o "$RUNNER_TEMP/just.tar.gz"
          tar --no-same-owner -xzf "$RUNNER_TEMP/just.tar.gz" -C "$RUNNER_TEMP/just-bin" just
          echo "$RUNNER_TEMP/just-bin" >> "$GITHUB_PATH"
      - name: Apply only the isolated stack-copy patch to pinned source
        working-directory: upstream-engine
        run: |
          git apply --check ../investigation/argentum-six-precons/staged-engine/0004-stack-object-copying.patch
          git apply ../investigation/argentum-six-precons/staged-engine/0004-stack-object-copying.patch
          git diff --check
      - name: Verify SDK contract, batch copies and existing spell retargeting
        working-directory: upstream-engine
        run: |
          just test-class 'StackObjectCopy*Test' --no-daemon --max-workers=2 -PkotlinCompileParallelism=1 -Dorg.gradle.configuration-cache=false
          just test-class SpellCopyRetargetingTest --no-daemon --max-workers=2 -PkotlinCompileParallelism=1 -Dorg.gradle.configuration-cache=false
          just test-class SdkSurfaceBaselineTest --no-daemon --max-workers=2 -PkotlinCompileParallelism=1 -Dorg.gradle.configuration-cache=false
          just test-class SdkIndexTest --no-daemon --max-workers=2 -PkotlinCompileParallelism=1 -Dorg.gradle.configuration-cache=false
      - name: Run full engine and card-scenario regressions
        working-directory: upstream-engine
        run: just test-rules
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-argentum-stack-copy-results
          path: |
            upstream-engine/mtg-sdk/build/test-results/
            upstream-engine/rules-engine/build/test-results/
            upstream-engine/mtg-sets/**/build/test-results/
          retention-days: 14
