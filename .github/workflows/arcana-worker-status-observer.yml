name: Arcana Worker Status Observer
# Read-only GitHub work-unit observation. No billing secrets or worker dispatch.
on:
  schedule:
    # Bounded freshness backstop; actionable changes use the events below.
    - cron: '7,37 * * * *'
  workflow_run:
    workflows:
      - Running Copilot cloud agent
    types: [completed]
  issues:
    types: [opened, closed, assigned, unassigned, labeled, unlabeled]
  pull_request_target:
    types: [opened, closed, reopened]
  workflow_dispatch:
permissions:
  actions: read # verify exact-head suite completion evidence through loadUnits
  contents: read
  issues: write # edit only the observer's bot status comment on issue #78
  pull-requests: read
concurrency:
  group: arcana-worker-observer
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Restore GitHub API ETag cache (304 Not Modified does not count against the API quota)
        uses: actions/cache/restore@v4
        with:
          path: .gh-etag-cache
          key: gh-etag-v1-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          restore-keys: gh-etag-v1-
      - name: Publish observed workers (NO assignment)
        uses: actions/github-script@v7
        env:
          ARCANA_READ_TOKEN: ${{ github.event_name != 'pull_request' && secrets.ARCANA_READ_TOKEN || '' }}
        with:
          script: |
            try { require('./scripts/gh-etag-cache.cjs').install(github, { core }); } catch (e) { core.info('GitHub API ETag cache unavailable: ' + e.message); }
            const { refreshWorkerStatus } = require('./scripts/worker-status.cjs');
            await refreshWorkerStatus({ github, context, core });
      - name: Save GitHub API ETag cache
        if: always() && hashFiles('.gh-etag-cache/cache.json.gz') != ''
        uses: actions/cache/save@v4
        with:
          path: .gh-etag-cache
          key: gh-etag-v1-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
