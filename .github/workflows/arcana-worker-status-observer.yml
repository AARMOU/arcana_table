name: Arcana Worker Status Observer
# Read-only GitHub work-unit observation. No billing secrets or worker dispatch.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_run:
    workflows:
      - Arcana Card Worker Dispatcher
      - Arcana CI Failure Router
      - Arcana Queue Feeder
      - Running Copilot cloud agent
    types: [completed]
  issues:
    types: [opened, closed, assigned, unassigned, labeled, unlabeled]
  pull_request_target:
    types: [opened, closed, reopened]
  workflow_dispatch:
permissions:
  actions: read # verify exact-head suite completion evidence through loadUnits
  contents: read
  issues: write # edit only the observer's bot status comment on issue #78
  pull-requests: read
concurrency:
  group: arcana-worker-observer
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Publish observed workers (NO assignment)
        uses: actions/github-script@v7
        with:
          script: |
            const { refreshWorkerStatus } = require('./scripts/worker-status.cjs');
            await refreshWorkerStatus({ github, context, core });
