name: Game-over cause logging validation
on:
  push:
    branches: [gpt/game-over-cause-logging-20261022]
permissions:
  contents: read
concurrency:
  group: game-over-cause-logging-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile app and run focused game-end regression
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --max-workers=2 :app:testDebugUnitTest --tests '*GameOutcomeDetailsTest*' --tests '*LocalArgentumHostTest*'
      - name: Keep test evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcana-game-over-logging-test-results
          path: |
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
