name: B140 Nullifier generated Cardkit index refresh
on:
  push:
    branches:
      - gpt/b140-nullifier-processor-port-20261028
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: b140-nullifier-patterns-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regenerate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Verify isolated branch and regenerate only Cardkit patterns
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/gpt/b140-nullifier-processor-port-20261028"
          tools/cardkit/cardkit patterns
          git diff --name-only > /tmp/changed.txt
          cat /tmp/changed.txt
          if test -s /tmp/changed.txt; then
            while IFS= read -r file; do
              case "$file" in
                docs/agents/generated/pattern-index.md|docs/agents/generated/pattern-index.json) ;;
                *) echo "Refusing unrelated changed file: $file" >&2; exit 1 ;;
              esac
            done < /tmp/changed.txt
            git add -- docs/agents/generated/pattern-index.md docs/agents/generated/pattern-index.json
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs(cardkit): regenerate Nullifier tested-pattern index'
            git push origin "HEAD:refs/heads/gpt/b140-nullifier-processor-port-20261028"
          else
            echo "Pattern index already current."
          fi
