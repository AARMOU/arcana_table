                      'newlyImplementedCardsLoadIntoTheOfflineGame', 'incursionMirrorAiGame'}
          assert {c.get('name') for c in cases} == expected, ('Missing exact Eldrazi tests', cases)
          assert all(not any(c.find(k) is not None for k in ('skipped','failure','error'))
                     for c in cases), 'Eldrazi required test skipped or failed'
          assert total_failures == total_errors == 0, (total_failures, total_errors)
          print('PASS: all required Eldrazi scenarios executed, AI mirror ended, and app tests green')
          PY
      - name: Release must not expose debug test scenarios
        working-directory: android
