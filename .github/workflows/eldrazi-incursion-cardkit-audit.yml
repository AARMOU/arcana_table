name: Eldrazi Incursion Cardkit exact gap audit
on:
  push:
    branches: [gpt/eldrazi-incursion-cardkit-audit-20261024]
    paths:
      - 'investigation/argentum-six-precons/eldrazi-incursion-cardkit-triage.py'
      - '.github/workflows/eldrazi-incursion-cardkit-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eldrazi-incursion-cardkit-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Classify all missing original cards using current integrated Cardkit
        run: python3 investigation/argentum-six-precons/eldrazi-incursion-cardkit-triage.py
      - name: Verify read-only audit and report presence
        run: |
          git diff --exit-code
          test -s investigation/argentum-six-precons/eldrazi-cardkit-report.json
          test -s investigation/argentum-six-precons/eldrazi-cardkit-report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eldrazi-incursion-cardkit-classification
          retention-days: 30
          if-no-files-found: warn
          path: |
            investigation/argentum-six-precons/eldrazi-cardkit-report.json
            investigation/argentum-six-precons/eldrazi-cardkit-report.md
