name: Studio Intake filter regression proof (isolated)
on:
  push:
    branches:
      - gpt/studio-intake-proof-20261112
    paths:
      - '.github/workflows/studio-intake-proof-20261112.yml'
permissions:
  contents: read
jobs:
  deck-builder-filter:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare pinned Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          curl -fL --retry 2 "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" -o "$RUNNER_TEMP/cmdline.zip"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $RUNNER_TEMP/cmdline.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/cmdline.zip" -d "$RUNNER_TEMP/sdk-unpacked"
          mv "$RUNNER_TEMP/sdk-unpacked/cmdline-tools/"* "$ANDROID_HOME/cmdline-tools/latest/"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          (yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > /dev/null) || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Run previously failing DeckBuilder UI suite (no APK)
        working-directory: android
        run: |
          unset ANDROID_SDK_ROOT
          ./gradlew :app:testDebugUnitTest --tests com.arcanatable.ui.DeckBuilderUiTest --no-daemon --stacktrace
      - name: Verify app and tests unchanged from Boneknuckles source
        run: |
          git fetch --depth=1 origin 213b6ce4562704ec2131f817b191d1b01fe3a08b
          git diff --exit-code FETCH_HEAD HEAD -- android/
