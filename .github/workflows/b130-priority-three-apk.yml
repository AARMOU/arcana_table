name: Arcana Build 130 targeting progress exact-resume preview
on:
  push:
    branches: [gpt/arcana-b130-priority-three-preview]
permissions:
  contents: read
concurrency:
  group: arcana-b130-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout isolated preview
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Execute new and inherited Android JVM / Robolectric regressions
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --max-workers=2 :app:testDebugUnitTest \
            --tests '*IncomingTargetAlertTest*' \
            --tests '*EngineProcessingInfoTest*' \
            --tests '*OfflineCheckpointStoreTest*' \
            --tests '*OfflineEngineResumeTest*' \
            --tests '*LocalArgentumHostTest*' \
            --tests '*GameLogGroupingTest*' \
            --tests '*DecisionDisplayTextTest*' \
            --tests '*ReadableNotificationDurationTest*' \
            --tests '*TableViewNavigationTest*' \
            --tests '*TableOverviewInteractionTest*' \
            --tests '*ZonePlaySourceTest*' \
            --tests '*GraveyardExileLegalActionsTest*' \
            --tests '*ZoneCardActionsUiTest*' \
            --tests '*ArgentumInteractionTest*' \
            --tests '*GameRulesTest*'
      - name: Compile isolated debug-signed Build 130 APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 :app:assembleDebug
      - name: Verify actual APK metadata and Android debug certificate
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/ArcanaTable-B130-Targeting-Progress-Resume-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging dist/ArcanaTable-B130-Targeting-Progress-Resume-debug.apk | head -n 8 > dist/package-info.txt
          grep -F "package: name='com.arcanatable.argentum' versionCode='130' versionName='0.33.8-build130-targeting-progress-resume'" dist/package-info.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs dist/ArcanaTable-B130-Targeting-Progress-Resume-debug.apk > dist/signing-info.txt
          printf 'source_branch=%s\nsource_sha=%s\npackage=com.arcanatable.argentum\nversionCode=130\nproduction_signed=false\nproduction_untouched=true\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" > dist/provenance.txt
          sha256sum dist/ArcanaTable-B130-Targeting-Progress-Resume-debug.apk > dist/SHA256SUMS.txt
      - name: Upload actual tests / failures for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ArcanaTable-B130-Test-Reports
          path: |
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload installable debug-signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ArcanaTable-B130-Preview-APK
          path: dist/
          if-no-files-found: error
          retention-days: 14
