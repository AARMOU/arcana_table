name: Eldrazi Temple exact mana restriction (source-only)
# #152 / #150: never persists runtime jars, publishes decks, signs APKs or dispatches Copilot.
on:
  push:
    branches: [gpt/eldrazi-temple-exact-mana-source-20261024, gpt/eldrazi-temple-card-source-20261024]
    paths:
      - 'engine-upgrade/eldrazi-temple/**'
      - '.github/workflows/eldrazi-temple-source-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eldrazitemple-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  restricted-mana:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: wingedsheep/argentum-engine
          ref: 61e71e586b100faa661f86cac827ac3c3bbb5a78
          path: argentum-engine
          persist-credentials: false
      - name: Apply mandatory pinned Arcana source patches
        run: python3 engine-upgrade/audit_patches.py
      - name: Apply exact Eldrazi Temple source patch and copy regression scenarios
        run: |
          set -euo pipefail
          git -C argentum-engine apply --check "$GITHUB_WORKSPACE/engine-upgrade/eldrazi-temple/patches/0001-colorless-eldrazi-source-mana.patch"
          git -C argentum-engine apply "$GITHUB_WORKSPACE/engine-upgrade/eldrazi-temple/patches/0001-colorless-eldrazi-source-mana.patch"
          cp engine-upgrade/eldrazi-temple/engine-tests/EldraziTempleManaRestrictionTest.kt argentum-engine/rules-engine/src/test/kotlin/com/wingedsheep/engine/scenarios/\n          cp engine-upgrade/eldrazi-temple/engine-tests/EldraziTempleGameplayScenarioTest.kt argentum-engine/rules-engine/src/test/kotlin/com/wingedsheep/engine/scenarios/\n          mkdir -p argentum-engine/rules-engine/src/test/kotlin/com/arcanatable/customcards/cards\n          cp engine-upgrade/eldrazi-temple/candidate/EldraziTemple.kt argentum-engine/rules-engine/src/test/kotlin/com/arcanatable/customcards/cards/
          git -C argentum-engine diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: SDK tests and API serialization compatibility
        working-directory: argentum-engine
        run: ./scripts/gradle-locked --no-daemon --max-workers=2 -PkotlinCompileParallelism=1 -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m' :mtg-sdk:test
      - name: Exact colorless Eldrazi payment positive and negative engine tests
        working-directory: argentum-engine
        run: ./scripts/gradle-locked --no-daemon --max-workers=2 -PkotlinCompileParallelism=1 -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m' :rules-engine:test --tests 'com.wingedsheep.engine.scenarios.EldraziTemple*'
      - name: Summarize actual test XML
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          c = dict(tests=0, failures=0, errors=0, skipped=0)
          names = []
          for p in Path('argentum-engine').glob('**/build/test-results/**/TEST-*.xml'):
              r = ET.parse(p).getroot()
              for k in c: c[k] += int(r.get(k, 0))
              if 'EldraziTemple' in p.name:
                  names.append(p.name)
          print('Eldrazi Temple source-only CI:', c)
          print('Matching scenario XML:', names)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eldrazi-temple-engine-source-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            engine-upgrade/patch-report.json
            argentum-engine/**/build/test-results/**/TEST-*.xml
