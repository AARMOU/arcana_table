name: Deploy Arcana directed Cloudflare relay (owner approved)
# Owner explicitly requested live relay deployment, 2026-10-26.
# Isolated deployment lane; does not merge Android, touch APK signing, or publish to Play.
on:
  push:
    branches: [gpt/owner-approved-cloudflare-relay-deploy-20261026]
    paths:
      - '.github/workflows/deploy-cloudflare-relay-20261026.yml'
  workflow_dispatch:
concurrency:
  group: arcana-cloudflare-relay-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    if: github.repository == 'AARMOU/arcana_table'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify exact approved relay source
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 6641f1883f54ca3a13c8faa7ef0b01b05976ef74 HEAD
          test -f android/cloud-room/src/index.ts
          grep -F 'relay: 1' android/cloud-room/src/index.ts
          test -f android/cloud-room/scripts/verify-directed-relay.mjs
          grep -F 'name = "arcana-table-rooms"' android/cloud-room/wrangler.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: android/cloud-room/package-lock.json
      - name: Install and typecheck exact four-player relay
        working-directory: android/cloud-room
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
      - name: Run locally hosted per-seat privacy and directed-relay regression
        working-directory: android/cloud-room
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/wrangler dev --local --port 8787 --ip 127.0.0.1 > "$RUNNER_TEMP/relay-local.log" 2>&1 &
          relay_pid=$!
          trap 'kill "$relay_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8787/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat "$RUNNER_TEMP/relay-local.log"; exit 1; fi
          node scripts/verify-directed-relay.mjs
      - name: Require authorized Cloudflare CI credentials
        shell: bash
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo '::error title=Cloudflare not connected::Set repository Actions secret CLOUDFLARE_API_TOKEN (or CF_API_TOKEN). Never post a token in an issue/chat.'
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo '::error title=Cloudflare account unknown::Set repository Actions secret/variable CLOUDFLARE_ACCOUNT_ID (or CF_ACCOUNT_ID).'
            exit 1
          fi
      - name: Deploy exact directed four-player Worker to Cloudflare
        working-directory: android/cloud-room
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/wrangler deploy --keep-vars 2>&1 | tee "$RUNNER_TEMP/arcana-cloudflare-deploy.log"
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          data = Path(os.environ['RUNNER_TEMP'], 'arcana-cloudflare-deploy.log').read_text(errors='replace')
          urls = re.findall(r'https://[a-zA-Z0-9.-]+\\.workers\\.dev', data)
          if not urls:
              raise SystemExit('Cloudflare may have deployed, but Wrangler did not report a workers.dev URL. Check deploy output and account settings.')
          origin = urls[-1].rstrip('/')
          out = Path(os.environ['GITHUB_ENV'])
          with out.open('a') as f: f.write('ARCANA_LIVE_RELAY_URL=' + origin + '\\n')
          print('Reported public Worker: ' + origin)
          PY
      - name: Verify live /health and private directed relay over public internet
        working-directory: android/cloud-room
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ARCANA_LIVE_RELAY_URL:-}"
          curl -fLsS --retry 3 --retry-delay 2 "${ARCANA_LIVE_RELAY_URL}/health" -o "$RUNNER_TEMP/arcana-health.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          health = json.loads(Path(os.environ['RUNNER_TEMP'], 'arcana-health.json').read_text())
          assert health.get('ok') is True
          assert health.get('service') == 'arcana-table-rooms'
          assert health.get('protocol') == 1
          assert health.get('relay') == 1
          print('PASS: live Worker advertises directed private relay:1')
          PY
          ARCANA_RELAY_TEST_ORIGIN="$ARCANA_LIVE_RELAY_URL" node scripts/verify-directed-relay.mjs
          {
            echo '## Cloudflare Arcana multiplayer relay: LIVE'
            echo
            echo "Endpoint: ${ARCANA_LIVE_RELAY_URL}"
            echo
            echo 'Exact Worker source: 6641f1883f54ca3a13c8faa7ef0b01b05976ef74 (PR #268)'
            echo
            echo 'Public /health and real Cloudflare WebSocket directed-privacy checks: PASS'
            echo
            echo 'For Android lobby: enter endpoint above under Internet host/join settings.'
          } >> "$GITHUB_STEP_SUMMARY"
