name: Spatial Contortion engine overlay tests

on:
  push:
    branches:
      - gpt/argentum-warhammer-eldrazi-import
    paths:
      - 'precon-import/engine-overlay/**'
      - '.github/workflows/precon-spatial-contortion-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out isolated Arcana overlay
        uses: actions/checkout@v4
        with:
          path: arcana
      - name: Check out pinned upstream Argentum source
        uses: actions/checkout@v4
        with:
          repository: wingedsheep/argentum-engine
          ref: b118c4baabde9aa992dd7f13f2a888e8cc2db45c
          path: engine
      - name: Configure JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: 'engine/**/*.gradle*'
      - name: Install just task runner
        uses: extractions/setup-just@v2
      - name: Apply candidates to disposable upstream worktree
        run: |
          cp -a arcana/precon-import/engine-overlay/. engine/
          test -s engine/mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/ogw/cards/SpatialContortion.kt
      - name: Targeted rules behavior scenarios
        working-directory: engine
        run: just test-class SpatialContortionScenarioTest
      - name: Check canonical / reprint mapping
        working-directory: engine
        run: just check-card-printing "Spatial Contortion"
