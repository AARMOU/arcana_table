name: Arcana B140 Combat Play AAB (unsigned; original private upload-key signing)
# Owner-authorized AAB packaging of the EXACT WORKING B138 Turbo gameplay/UI source.
# Uses B138 pinned engine/card JAR+assets; runner-only pin merges; no main PR merges.
# Never put Play upload keystore, credentials or a signed AAB in this workflow.
on:
  push:
    branches:
      - gpt/b140-combat-play-aab-20261027
    paths:
      - .github/workflows/b140-combat-play-aab.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arcana-b140-combat-play-aab
  cancel-in-progress: false

jobs:
  aab:
    name: B139 Combat Turbo source -> B140 production-ID unsigned AAB
    if: github.repository == 'AARMOU/arcana_table'
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - name: Checkout pinned user-tested B139 Combat source without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact frozen engine and card data from user-tested B138
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-out
          BASE=41f7556676fd5d5d0b493d47db65450ecdd142e4
          git merge-base --is-ancestor "$BASE" HEAD
          PIN=50e95c6edbf4e9ef1085265083333f006d8fa62f
          git merge-base --is-ancestor "$PIN" HEAD
          test "$(git diff --name-only "$PIN" HEAD)" = ".github/workflows/b140-combat-play-aab.yml" || { echo "::error::Unexpected files after pinned combat source"; exit 1; }
          echo "PR314+PR315+PR316 source pinned at $PIN" > ci-out/approved-combat-source.txt
          git rev-parse HEAD > ci-out/source-b140-combat-sha.txt
          for p in \
            android/app/libs/argentum-ai.jar \
            android/app/libs/argentum-mtg-sdk-tooling.jar \
            android/app/libs/argentum-mtg-sdk.jar \
            android/app/libs/argentum-rules-engine.jar \
            android/app/src/main/assets/argentum/all-cards.index.tsv \
            android/app/src/main/assets/argentum/all-cards.jsonl \
            android/app/src/main/assets/argentum/custom-cards.index.tsv \
            android/app/src/main/assets/argentum/custom-cards.jsonl; do
              test "$(git rev-parse "HEAD:$p")" = "$(git rev-parse "$BASE:$p")" || { echo "::error::Unreviewed engine/card drift in $p"; exit 1; }
              printf '%s %s\n' "$(git rev-parse "HEAD:$p")" "$p" >> ci-out/reused-b138-assets.txt
          done
          echo 'PASS: original pinned B138 engine JARs and card sources unchanged in B140 Combat'
      - name: Runner-only source assembly identical to successful B139 combat debug
        shell: bash
        run: |
          set -euo pipefail
          git config user.name arcana-b139-source-assembler
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for item in \
            303:4317184c3fb1666a95a5242e20f4fd777eb47e44 \
            304:e82b57621374c7aca0a5d854f029ddda4176d597 \
            305:0f08acef5ea02dc0ee9469adabcf7f0871efc77d \
            306:1fafb3b1adfb52fdabb8a4f9f27283a263b3faf9 \
            307:d171b27a21aed98dd3074c02f2c4f01e84c96fd7 \
            308:abcae2a5e3b9bfb8bff80aa393c34112199b1bbd; do
              IFS=: read -r pr sha <<< "$item"
              git fetch --no-tags origin "$sha"
              test "$(git rev-parse FETCH_HEAD)" = "$sha"
              git merge --no-ff --no-edit -X ours "$sha" -m "Runner-only B139 source: B138 PR #$pr $sha"
              printf 'PR #%s %s\n' "$pr" "$sha" >> ci-out/runner-only-pins.txt
          done
          git rev-parse HEAD > ci-out/assembled-source-sha.txt
          git diff --check
          # Same exact UI blobs as the successful B139 Combat Turbo APK.
          for p in CombatStackBoard.kt CombatStacks.kt ArgentumCombatBoard.kt; do
            test "$(git rev-parse HEAD:android/app/src/main/java/com/arcanatable/$p)" =               "$(git rev-parse 87e047ca4ec57eabd94fde8ce1d2613d48b53a5d:android/app/src/main/java/com/arcanatable/$p)"               || { echo "::error::Combat UI source drift: $p"; exit 1; }
          done
          echo 'PASS: combat source exactly matches Claude PR315 in user-tested debug APK'
      - name: Assert B139 UI, PR314 cascade, PR315 combat and PR316 safety survived assembly
        shell: bash
        run: |
          set -euo pipefail
          a=android/app/src/main/java/com/arcanatable
          t=android/app/src/test/java/com/arcanatable
          grep -Fq 'shouldKeepMultiplayerConnectionGuard(' "$a/TableEffects.kt"
          grep -Fq 'argentumOpeningHand = hand' "$a/TableArgentum.kt"
          grep -Fq 'val hostLobbyState = wifiMultiLobbyState' "$a/TableMultiLobby.kt"
          grep -Fq 'tutorialCoachRegion(maxW, maxH, target)' "$a/TutorialCoach.kt"
          grep -Fq 'receiveRoomChatFromGuest' "$a/TableWifi.kt"
          grep -Fq 'ArgentumRoomChat.DELIVERY' "$a/TableArgentum.kt"
          grep -Fq 'class TutorialRun' "$a/TutorialProgress.kt"
          test -s "$t/MultiplayerConnectionGuardTest.kt"
          test -s "$t/ArgentumRoomChatTest.kt"
          grep -Fq 'playedCardPopupDurationMs(popupDurationSeconds)' "$a/PlayFeed.kt"
          grep -Fq 'Played-card popup time' "$a/AdjustUiPage.kt"
          grep -Fq 'lastBackgroundYourMoveKey' "$a/TableEffects.kt"
          grep -Fq 'ArgentumPassing.interruptingStackItem' "$a/TableEffects.kt"
          grep -Fq 'onAutoPass = { if (argentumEnabled) togglePassToMyTurn() }' "$a/TableOverlays.kt"
          grep -Fq 'targetCount > item.targetIds.size' "$a/ArgentumPassing.kt"
          test -s "$t/ArgentumPassingTest.kt"
          test -s "$t/ReadableNotificationDurationTest.kt"
          grep -Fq 'aiThrottle.skipSearch(current, priority)' "$a/engine/LocalArgentumHost.kt"
          grep -Fq 'LifeTotalComponent' "$a/engine/ai/AiCascadeThrottle.kt"
          grep -Fq 'aiLifeChangeInvalidatesCascadeResourceFingerprint' android/custom-cards/src/test/kotlin/com/arcanatable/customcards/TokenCascadeEndStepStressTest.kt
          grep -Fq 'fun ArgentumAttackBoard(' "$a/CombatStackBoard.kt"
          grep -Fq 'fun ArgentumBlockBoard(' "$a/CombatStackBoard.kt"
          grep -Fq 'attackTargets = attackTargetsFrom(state, attackers)' "$a/ArgentumInteraction.kt"
          test -s "$t/CombatStacksTest.kt"
          test -s "$t/ui/DesignPreviewTest.kt"
          python3 tools/check_android_regex.py
          python3 tools/verify_launcher_branding.py
          python3 - <<'PY'
          from pathlib import Path
          import json
          x=json.loads(Path('android/app/src/main/assets/tutorials/catalog.json').read_text())
          assert len(x['chapters'])==20, 'Missing B138 tutorial chapters'
          print('PASS: user-tested combat, multiplayer, PR313, PR314, PR315 and PR316 fixes + 20 tutorials')
          PY
      - name: Install Java 17 / cached Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Stamp Play versionCode 140, production application ID, no debug signing
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/fast_apk_snapshot.py version --version-code 140
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle.kts'); s=p.read_text()
          before='versionName = "0.33.14-build140-fast-test"'
          assert s.count(before)==1
          s=s.replace(before,'versionName = "0.33.16-build140"',1)
          assert 'applicationId = "com.arcanatable"' in s
          assert 'versionCode = 140' in s
          assert 'signingConfig = signingConfigs.getByName("debug")' not in s
          p.write_text(s)
          print('PASS: com.arcanatable, versionCode 140, release variant with NO debug signing')
          PY
      - name: Run validated combat Android tests, cascade stress, lint, produce unsigned AAB
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          # --tests applies only to the Test task. Never pass it to bundleRelease.
          ./gradlew --no-daemon --max-workers=2 \
            :app:testDebugUnitTest \
            --tests 'com.arcanatable.ArgentumPassingTest' \
            --tests 'com.arcanatable.ReadableNotificationDurationTest' \
            --tests 'com.arcanatable.MultiplayerConnectionGuardTest' \
            --tests 'com.arcanatable.ArgentumRoomChatTest' \
            --tests 'com.arcanatable.MultiplayerLobbyVisibilityTest' \
            --tests 'com.arcanatable.TutorialRunTest' \
            --tests 'com.arcanatable.TutorialCoachPlacementTest' \
            --tests 'com.arcanatable.CombatStacksTest' \
            --tests 'com.arcanatable.ui.DesignPreviewTest' \
            --tests 'com.arcanatable.ui.TutorialAuditUiTest' \
            2>&1 | tee ../ci-out/b140-combat-android-focused-tests.log | tail -150
          ./gradlew --no-daemon --max-workers=2 :custom-cards:test \
            --tests 'com.arcanatable.customcards.TokenCascadeEndStepStressTest' \
            --tests 'com.arcanatable.customcards.OfflineHumanAutoPassParityTest' \
            2>&1 | tee ../ci-out/b140-token-cascade-and-ai-safety.log | tail -100
          ./gradlew --no-daemon --max-workers=2 :app:lintRelease :app:bundleRelease \
            2>&1 | tee ../ci-out/b140-combat-release-lint-bundle.log | tail -150
      - name: Validate focused combat/cascade tests, unsigned AAB archive and source parity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          from zipfile import ZipFile
          import json,hashlib
          root=Path('android/app/build/test-results/testDebugUnitTest')
          names=['ArgentumPassingTest','ReadableNotificationDurationTest',
             'MultiplayerConnectionGuardTest','ArgentumRoomChatTest',
             'MultiplayerLobbyVisibilityTest','TutorialRunTest','TutorialCoachPlacementTest',
             'CombatStacksTest','DesignPreviewTest','TutorialAuditUiTest']
          count=0
          for name in names:
              files=list(root.glob('TEST-*'+name+'.xml'))
              assert len(files)==1,(name,files)
              suite=ET.parse(files[0]).getroot()
              tests=int(suite.get('tests','0'));count+=tests
              assert tests>0,(name,'no tests')
              for key in ('failures','errors','skipped'):
                  assert int(suite.get(key,'0'))==0,(name,key,suite.attrib)
          custom=Path('android/custom-cards/build/test-results/test')
          for name in ('TokenCascadeEndStepStressTest','OfflineHumanAutoPassParityTest'):
              files=list(custom.glob('TEST-*'+name+'.xml'))
              assert len(files)==1,(name,files)
              suite=ET.parse(files[0]).getroot()
              assert int(suite.get('tests','0'))>0,(name,'no tests')
              for k in ('failures','errors','skipped'):
                  assert int(suite.get(k,'0'))==0,(name,k,suite.attrib)
          p=Path('android/app/build/outputs/bundle/release/app-release.aab')
          assert p.stat().st_size>10_000_000
          with ZipFile(p) as z:
              assert z.testzip() is None
              names=set(z.namelist())
              for name in ('all-cards.index.tsv','custom-cards.index.tsv'):
                  path='base/assets/argentum/'+name
                  assert z.read(path)==Path('android/app/src/main/assets/argentum',name).read_bytes()
              assert len(json.loads(z.read('base/assets/tutorials/catalog.json'))['chapters'])==20
          out=Path('ci-out/ArcanaTable-B140-Combat-UNSIGNED.aab')
          out.write_bytes(p.read_bytes())
          Path('ci-out/B140-UNSIGNED-AAB-SHA256.txt').write_text(hashlib.sha256(out.read_bytes()).hexdigest()+'  '+out.name+'\n')
          Path('ci-out/PRIVATE-SIGNING-REQUIRED.txt').write_text(
              'BUILD 140 / com.arcanatable, original B139 combat-source parity. This AAB is intentionally UNSIGNED.\n'
              'Privately sign with the ORIGINAL verified arcana-upload key; do not upload the key to GitHub.\n'
              'Device-tested B139 Combat Turbo source, focused combat/cascade tests and release lint; broader card suite is separately not green.\n')
          print('PASS:',count,'focused combat tests, cascade/AI safety, AAB archive + tutorial/card parity, unsigned release artifact')
          PY
      - name: Upload B140 UNSIGNED Play-target combat AAB for private upload-key signing
        uses: actions/upload-artifact@v4
        with:
          name: ArcanaTable-B140-Combat-UNSIGNED-AAB
          path: ci-out/
          retention-days: 14
          if-no-files-found: error
      - name: Upload logs and tests even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ArcanaTable-B140-Combat-build-diagnostics
          path: |
            ci-out/
            android/app/build/test-results/testDebugUnitTest/
          retention-days: 14
          if-no-files-found: warn
