name: Arcana Card Certification Premerge
on:
  pull_request:
    paths:
      - 'certification/**'
      - '.github/workflows/arcana-independent-card-certification.yml'
      - '.github/workflows/arcana-card-certification-premerge.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  independent-card-scenarios:
    name: Compile and execute all four independent Resurrection Orb scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: trusted
          persist-credentials: false
      - name: Verify reusable policy and Python runner syntax
        run: |
          node --test trusted/certification/policy.test.cjs
          python3 -m py_compile trusted/certification/runner.py
      - name: Find current Copilot card implementation
        id: candidate
        uses: actions/github-script@v7
        with:
          script: |
            const p = (await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: 410
            })).data;
            if (p.state !== 'open' ||
                p.base.ref !== 'gpt/arcana-integration-next' ||
                p.title !== 'Implement Resurrection Orb' ||
                String(p.user?.login || '').toLowerCase() !== 'copilot' ||
                !/Fixes #408\b/.test(p.body || '')) {
              core.setFailed('The referenced Resurrection Orb card candidate changed.');
              return;
            }
            core.setOutput('sha', p.head.sha);
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          path: candidate
          persist-credentials: false
      - name: Inject independent scenarios using the shared trusted runner
        id: suite
        run: |
          python3 trusted/certification/runner.py prepare \
            --manifest trusted/certification/suites.json --key resurrection-orb \
            --trusted trusted --candidate candidate --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Run trusted tests against real pinned Argentum engine
        working-directory: candidate/android
        env:
          TEST_CLASS: ${{ steps.suite.outputs.testClass }}
        run: ./gradlew --no-daemon --max-workers=2 :custom-cards:test --tests "$TEST_CLASS"
      - name: Verify every registered independent test passed using the shared runner
        run: |
          python3 trusted/certification/runner.py verify \
            --manifest trusted/certification/suites.json --key resurrection-orb --candidate candidate
