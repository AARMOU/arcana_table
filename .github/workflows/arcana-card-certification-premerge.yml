name: Arcana Card Certification Premerge
on:
  pull_request:
    paths:
      - 'certification/**'
      - '.github/workflows/arcana-independent-card-certification.yml'
      - '.github/workflows/arcana-card-certification-premerge.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  plan:
    name: Select suites with an open card PR
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - id: plan
        uses: actions/github-script@v7
        with:
          script: |
            const P = require('./certification/policy.cjs');
            const { planPremerge } = require('./certification/premerge-plan.cjs');
            const manifest = P.readManifest('./certification/suites.json');
            const changedFiles = (await github.paginate(github.rest.pulls.listFiles, {...context.repo,
              pull_number: context.payload.pull_request.number, per_page: 100})).map(f => f.filename);
            const openPrs = await github.paginate(github.rest.pulls.list, {...context.repo, state: 'open', per_page: 100});
            const r = planPremerge({ manifest, changedFiles, openPrs });
            if (r.missing.length) core.notice('No open card PR for: ' + r.missing.join(', '));
            core.info('Suites to execute: ' + JSON.stringify(r.include));
            core.setOutput('matrix', JSON.stringify({ include: r.include }));
            core.setOutput('count', String(r.include.length));

  independent-card-scenarios:
    name: Execute trusted independent card scenarios
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: trusted
          persist-credentials: false
      - name: Verify reusable policy and Python runner syntax
        run: |
          node --test trusted/certification/policy.test.cjs trusted/certification/premerge-plan.test.cjs trusted/certification/backfill.test.cjs
          python3 -m py_compile trusted/certification/runner.py
      - name: Find current Copilot card implementation
        id: candidate
        uses: actions/github-script@v7
        env:
          CANDIDATE_PR: ${{ matrix.pr }}
          CANDIDATE_ISSUE: ${{ matrix.issue }}
          CANDIDATE_TITLE: ${{ matrix.title }}
        with:
          script: |
            const p = (await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(process.env.CANDIDATE_PR)
            })).data;
            if (p.state !== 'open' ||
                p.base.ref !== 'gpt/arcana-integration-next' ||
                p.title !== process.env.CANDIDATE_TITLE ||
                String(p.user?.login || '').toLowerCase() !== 'copilot' ||
                !new RegExp('Fixes #'+process.env.CANDIDATE_ISSUE+'\\b').test(p.body || '')) {
              core.setFailed('The referenced card candidate changed or is no longer eligible.');
              return;
            }
            core.setOutput('sha', p.head.sha);
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          path: candidate
          persist-credentials: false
      - name: Inject independent scenarios using the shared trusted runner
        id: suite
        run: |
          python3 trusted/certification/runner.py prepare \
            --manifest trusted/certification/suites.json --key "${{ matrix.key }}" \
            --trusted trusted --candidate candidate --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Run trusted tests against real pinned Argentum engine
        working-directory: candidate/android
        env:
          TEST_CLASS: ${{ steps.suite.outputs.testClass }}
        run: ./gradlew --no-daemon --max-workers=2 :custom-cards:test --tests "$TEST_CLASS"
      - name: Verify every registered independent test passed using the shared runner
        run: |
          python3 trusted/certification/runner.py verify \
            --manifest trusted/certification/suites.json --key "${{ matrix.key }}" --candidate candidate
