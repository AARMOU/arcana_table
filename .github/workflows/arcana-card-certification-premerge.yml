name: Arcana Card Certification Premerge
on:
  pull_request:
    paths:
      - 'certification/**'
      - '.github/workflows/arcana-independent-card-certification.yml'
      - '.github/workflows/arcana-card-certification-premerge.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  independent-card-scenarios:
    name: Execute trusted independent card scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: resurrection-orb
            pr: 410
            issue: 408
            title: Implement Resurrection Orb
          - key: poxwalkers
            pr: 407
            issue: 406
            title: Implement Poxwalkers
          - key: celestine-the-living-saint
            pr: 360
            issue: 358
            title: Implement Celestine, the Living Saint
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: trusted
          persist-credentials: false
      - name: Verify reusable policy and Python runner syntax
        run: |
          node --test trusted/certification/policy.test.cjs
          python3 -m py_compile trusted/certification/runner.py
      - name: Find current Copilot card implementation
        id: candidate
        uses: actions/github-script@v7
        env:
          CANDIDATE_PR: ${{ matrix.pr }}
          CANDIDATE_ISSUE: ${{ matrix.issue }}
          CANDIDATE_TITLE: ${{ matrix.title }}
        with:
          script: |
            const p = (await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(process.env.CANDIDATE_PR)
            })).data;
            if (p.state !== 'open' ||
                p.base.ref !== 'gpt/arcana-integration-next' ||
                p.title !== process.env.CANDIDATE_TITLE ||
                String(p.user?.login || '').toLowerCase() !== 'copilot' ||
                !new RegExp('Fixes #'+process.env.CANDIDATE_ISSUE+'\\b').test(p.body || '')) {
              core.setFailed('The referenced card candidate changed or is no longer eligible.');
              return;
            }
            core.setOutput('sha', p.head.sha);
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          path: candidate
          persist-credentials: false
      - name: Inject independent scenarios using the shared trusted runner
        id: suite
        run: |
          printf '%s\n' '${{ steps.candidate.outputs.sha }}' > candidate-sha.txt
          python3 trusted/certification/runner.py prepare \
            --manifest trusted/certification/suites.json --key "${{ matrix.key }}" \
            --trusted trusted --candidate candidate --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Run trusted tests against real pinned Argentum engine
        working-directory: candidate/android
        env:
          TEST_CLASS: ${{ steps.suite.outputs.testClass }}
        run: ./gradlew --no-daemon --max-workers=2 :custom-cards:test --tests "$TEST_CLASS"
      - name: Verify every registered independent test passed using the shared runner
        run: |
          python3 trusted/certification/runner.py verify \
            --manifest trusted/certification/suites.json --key "${{ matrix.key }}" --candidate candidate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-${{ matrix.key }}-${{ github.event.pull_request.head.sha }}
          path: |
            candidate-sha.txt
            candidate/android/custom-cards/build/test-results/test/TEST-*IndependentCertificationTest.xml
          if-no-files-found: warn
