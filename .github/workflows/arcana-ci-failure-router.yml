name: Arcana CI Failure Router
# Install only after review. Execute trusted workflow source, never failed-PR code.
on:
  workflow_run:
    workflows:
      - Arcana Development CI
      - Argentum six-precon isolated worker regression
      - Isolated B131 shared-mechanics compatibility
      - Six-precon worker integration — full custom card regressions
    types: [completed]
permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write
concurrency:
  group: arcana-copilot-control
  cancel-in-progress: false
jobs:
  route-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/github-script@v7
        env:
          COPILOT_USAGE_SNAPSHOT: ${{ vars.COPILOT_USAGE_SNAPSHOT }}
          ARCANA_AUTOMATION_READY: ${{ vars.ARCANA_AUTOMATION_READY }}
        with:
          script: |
            const gate = require('./scripts/usage-gate.cjs');
            const { routeFailure } = require('./scripts/failure-routing.cjs');
            const budget = process.env.ARCANA_AUTOMATION_READY === 'true'
              ? gate.budgetFromEnv(process.env.COPILOT_USAGE_SNAPSHOT)
              : { level: 'unknown', maxNewAssignments: 0 };
            const result = await routeFailure({ github, context, budget });
            core.info(JSON.stringify(result));
            await core.summary.addHeading('Failure routing evidence').addCodeBlock(JSON.stringify(result)).write();
            if (result.state === 'permission-blocked') core.setFailed('PR comment requires pull-requests: write; no retry issued.');
