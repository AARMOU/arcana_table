name: Arcana CI Failure Router
# Must be installed on the default branch to receive workflow_run events.
# Never check out or execute code from the failed run.
on:
  workflow_run:
    workflows:
      - Arcana Development CI
      - Argentum six-precon isolated worker regression
      - Isolated B131 shared-mechanics compatibility
    types: [completed]
permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write
jobs:
  route-failure:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'failure' &&
          github.event.workflow_run.event != 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Route failures to their originating draft PR
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const owner = context.repo.owner, repo = context.repo.repo;
            if (!run.head_repository || run.head_repository.id !== context.payload.repository.id) {
              core.info('Skipping external repository run'); return;
            }
            if (!run.head_branch || !/^(copilot\/|gpt\/)/.test(run.head_branch)) {
              core.info('Skipping non-development branch'); return;
            }
            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100
            });
            const pr = prs.find(p => p.head.ref === run.head_branch &&
              p.head.repo?.id === context.payload.repository.id &&
              p.head.sha === run.head_sha && p.draft);
            if (!pr) { core.info('No matching current draft PR for this SHA'); return; }
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100
            });
            const marker = '<!-- arcana-ci-repair-router -->';
            const routed = comments.filter(c => c.body?.includes(marker));
            if (routed.some(c => c.body.includes('run-id:' + run.id))) {
              core.info('Run already routed'); return;
            }
            // Never loop indefinitely: three automated repair requests per PR.
            if (routed.length >= 3) {
              core.warning('Automated repair limit reached for PR #' + pr.number);
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number,
                body: '<!-- arcana-ci-repair-escalation -->\nAutomated repair limit reached (3 attempts). Manual review required. No further automatic Copilot requests.'
              });
              return;
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: run.id, per_page: 100
            });
            const failed = jobs.filter(j => j.conclusion === 'failure');
            const details = failed.slice(0, 8).map(j => {
              const step = (j.steps || []).find(s => s.conclusion === 'failure');
              return '- ' + j.name + (step ? ' / ' + step.name : '') +
                ' (' + j.html_url + ')';
            }).join('\n') || '- Failed job details unavailable; inspect run.';
            const body = [
              marker, 'run-id:' + run.id,
              '@copilot CI failed on this isolated development PR.',
              'Run: ' + run.html_url,
              'Commit: \`' + run.head_sha + '\`',
              'Failed jobs/steps:', details,
              'Reproduce and fix the underlying problem without weakening tests or rules.',
              'Commit only to this PR branch; rerun the full applicable regression.',
              'Do not merge, publish, release, modify main, or access production secrets.',
              'Automatic repair request ' + (routed.length + 1) + ' of 3.'
            ].join('\n\n');
            await github.rest.issues.createComment({owner, repo, issue_number: pr.number, body});
