name: Arcana CI Failure Router
# Execute trusted default-branch code, never failed-PR code.
# Repair requests need ARCANA_AUTOMATION_READY=true AND ARCANA_REPAIR_MODE=request,
# plus shared admission (work unit, capacity, ceilings, budget). ARCANA_REPAIR_MODE=off disables
# the router entirely; unset/observe records observations only.
on:
  workflow_run:
    workflows:
      - Arcana Development CI
      - Arcana Cardkit
      - Arcana Card Certification Premerge
      - Argentum six-precon isolated worker regression
      - Isolated B131 shared-mechanics compatibility
      - Six-precon worker integration — full custom card regressions
      # Recheck failures withheld while a builder was finishing, even if the
      # dispatcher completed successfully with nothing eligible to build.
      - Arcana Card Worker Dispatcher
    types: [completed]
  schedule:
    # Backfill missed failures. Paid requests still require repair=request and admission.
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Observe only; false permits repairs through existing admission gates'
        type: boolean
        default: true
permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write
concurrency:
  group: arcana-copilot-control
  cancel-in-progress: false
jobs:
  route-failure:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' || (github.event.workflow_run.name == 'Arcana Card Worker Dispatcher' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/github-script@v7
        env:
          COPILOT_BILLING_READ_TOKEN: ${{ secrets.COPILOT_BILLING_READ_TOKEN }}
          # Owner identity is required for Copilot PR-comment instructions; the bot still writes ledgers.
          COPILOT_DISPATCH_TOKEN: ${{ secrets.COPILOT_DISPATCH_TOKEN }}
          ARCANA_AI_CREDIT_BUDGET: ${{ vars.ARCANA_AI_CREDIT_BUDGET }}
          ARCANA_AI_CREDIT_RESERVE: ${{ vars.ARCANA_AI_CREDIT_RESERVE }}
          ARCANA_AUTOMATION_READY: ${{ vars.ARCANA_AUTOMATION_READY }}
          ARCANA_DISPATCH_MODE: ${{ vars.ARCANA_DISPATCH_MODE }}
          ARCANA_REPAIR_MODE: ${{ vars.ARCANA_REPAIR_MODE }}
          ARCANA_MAX_ACTIVE_UNITS: ${{ vars.ARCANA_MAX_ACTIVE_UNITS }}
          ARCANA_EST_CREDITS_PER_SESSION: ${{ vars.ARCANA_EST_CREDITS_PER_SESSION }}
          ARCANA_EST_CREDITS_PER_REPAIR: ${{ vars.ARCANA_EST_CREDITS_PER_REPAIR }}
          ARCANA_BILLING_LAG_HOURS: ${{ vars.ARCANA_BILLING_LAG_HOURS }}
        with:
          script: |
            const {readBudget}=require('./scripts/billing-monitor.cjs');
            const {runRouter}=require('./scripts/failure-routing.cjs');
            const {createCopilotDelivery}=require('./scripts/copilot-delivery.cjs');
            const {owner,repo}=context.repo;
            const delivery=createCopilotDelivery({owner,repo,token:process.env.COPILOT_DISPATCH_TOKEN});
            const result=await runRouter({github,context,env:process.env,readBudget,delivery});
            core.info(JSON.stringify(result));
            await core.summary.addHeading('Failure routing evidence').addCodeBlock(JSON.stringify(result)).write();
            const outcomes=Array.isArray(result)?result:[result];
            if(outcomes.some(r=>r.state==='permission-blocked'))core.setFailed('PR comment permission missing; no retry issued.');
            if(outcomes.some(r=>r.state==='delivery-uncertain'))core.setFailed('Owner-authenticated Copilot handoff unconfirmed; attempt reserved; owner review required.');
            if(outcomes.some(r=>r.state==='observation-unavailable'))core.setFailed('GitHub observation write unavailable; other PRs were still reconciled; no write retried.');

