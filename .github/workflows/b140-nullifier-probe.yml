name: B140 Nullifier exact-head engine acceptance
on:
  push:
    branches:
      - gpt/b140-nullifier-processor-port-20261028
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: b140-nullifier-engine-${{ github.ref }}
  cancel-in-progress: true
jobs:
  nullifier-real-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify generated Cardkit pattern index is current
        run: tools/cardkit/cardkit patterns --check
      - name: Execute B140 registered Nullifier engine regressions
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 :custom-cards:test --tests 'com.arcanatable.customcards.UlamogsNullifierScenarioTest'
      - name: Require exactly thirty-five executed, no skipped or failing scenarios
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = Path('android/custom-cards/build/test-results/test/TEST-com.arcanatable.customcards.UlamogsNullifierScenarioTest.xml')
          assert report.is_file(), f'Missing JUnit XML: {report}'
          root = ET.parse(report).getroot()
          stats = {key: int(root.get(key, '0')) for key in ('tests', 'failures', 'errors', 'skipped')}
          print(stats)
          assert stats == {'tests': 35, 'failures': 0, 'errors': 0, 'skipped': 0}, stats
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b140-nullifier-exact-head-junit
          retention-days: 14
          path: |
            android/custom-cards/build/test-results/test/
            android/custom-cards/build/reports/tests/test/

  incursion-ai-differential:
    # Diagnostic-only comparison; never mask a failing AI game or count it as playable.
    # Both runs execute the same existing B140 mirror-game test with different card sources.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: b140-control
            ref: a40935674ce3787388bf79e4106622e08d8252f6
          # Independent JVM/workspace replay of the *same* B140 source, test fixture,
          # seed and shuffled deck. Different results between these two controls
          # demonstrate nondeterminism without attributing it to Nullifier.
          - label: b140-control-replay
            ref: a40935674ce3787388bf79e4106622e08d8252f6
          - label: nullifier-candidate
            ref: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - name: Show exact checked-out source
        run: |
          git rev-parse HEAD
          git diff --exit-code
      - name: Use the same diagnostic-only AI mirror test on both engine sources
        # The integrated B140 fixture already has deterministic engine seeds and
        # strict per-action state replay. Overlay the same exact fixture on controls.
        # Only the test fixture is overlaid: B140 runtime/cards/assets stay untouched.
        run: |
          set -euo pipefail
          fixture=android/app/src/test/java/com/arcanatable/EldraziIncursionPlayableTest.kt
          git fetch --no-tags --depth=1 origin "${{ github.sha }}"
          git show "${{ github.sha }}:$fixture" > "$fixture"
          expected=$(git rev-parse "${{ github.sha }}:$fixture")
          actual=$(git hash-object "$fixture")
          test "$actual" = "$expected"
          echo "Mirror test fixture SHA: $actual"
          echo "Engine source SHA: $(git rev-parse HEAD)"
          git diff --name-only
          unexpected=$(git diff --name-only | grep -v -x "$fixture" || true)
          test -z "$unexpected"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Execute identical Eldrazi Incursion AI mirror on each exact source
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest --tests 'com.arcanatable.EldraziIncursionPlayableTest.incursionMirrorAiGame' --info
      - name: Preserve seed, assertion and stack trace for differential triage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: incursion-ai-mirror-${{ matrix.label }}-${{ github.sha }}
          retention-days: 14
          path: |
            android/app/build/test-results/test/
            android/app/build/reports/tests/testDebugUnitTest/
