name: Engine delay own-stack fast-pass parity (experimental only)
on:
  push:
    branches:
      - gpt/engine-delay-125-experiment
permissions:
  contents: read
concurrency:
  group: engine-delay-125-experiment-${{ github.ref }}
  cancel-in-progress: true
jobs:
  safety-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build124 per-window parity and AI tests
        working-directory: android
        run: |
          ./gradlew --no-daemon --max-workers=2 :custom-cards:test \
            --tests '*OfflineHumanAutoPassParityTest' \
            --tests '*AiRetargetingSearchTest' \
            --tests '*OfflineAiLargeBoardTest' --info 2>&1 | tee ../candidate-parity.log
      - name: Android host regression / compile candidate source
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest --tests '*LocalArgentumHostTest'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-delay-experimental-candidate
          path: |
            candidate-parity.log
            android/custom-cards/build/test-results/
            android/app/build/test-results/
