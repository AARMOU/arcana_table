name: Arcana Copilot Billing Watch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/arcana-copilot-billing-watch.yml'
      - 'scripts/billing-monitor.cjs'
      - 'scripts/usage-gate.cjs'
      - 'scripts/control-status.cjs'
      - 'scripts/control-workflows.cjs'
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: arcana-billing-watch
  cancel-in-progress: false
jobs:
  billing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/github-script@v7
        env:
          COPILOT_BILLING_READ_TOKEN: ${{ secrets.COPILOT_BILLING_READ_TOKEN }}
          ARCANA_AI_CREDIT_BUDGET: ${{ vars.ARCANA_AI_CREDIT_BUDGET }}
          ARCANA_AI_CREDIT_RESERVE: ${{ vars.ARCANA_AI_CREDIT_RESERVE }}
          # Retired; read only to warn when it is still set.
          ARCANA_PREMIUM_REQUEST_BUDGET: ${{ vars.ARCANA_PREMIUM_REQUEST_BUDGET }}
        with:
          script: |
            const {billingWatch}=require('./scripts/control-workflows.cjs');
            await billingWatch({github,context,core,env:process.env});
