name: Argentum six-precon card regression
on:
  push:
    branches:
      - gpt/argentum-six-precons
    paths:
      - android/custom-cards/src/**
      - .github/workflows/argentum-six-precons.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: argentum-six-precons-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Generate card data and run full custom-card regressions
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 :custom-cards:exportCards :custom-cards:test
      - name: Validate generated data has each imported card exactly once
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index = Path('android/app/src/main/assets/argentum/custom-cards.index.tsv').read_text()
          names = [line.split('\t')[0] for line in index.splitlines() if line.strip()]
          for name in ['Spatial Contortion', 'Skittering Invasion', 'Blight Grenade']:
              assert names.count(name) == 1, (name, names.count(name))
          print('Three staged definitions exported without duplicates')
          PY
      - name: Detect whitespace errors in generated card data
        run: git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: argentum-six-precons-card-results
          path: |
            android/custom-cards/build/test-results/
            android/custom-cards/build/reports/tests/
            android/app/src/main/assets/argentum/custom-cards.index.tsv
            android/app/src/main/assets/argentum/custom-cards.jsonl
          retention-days: 14
