name: Arcana B130 targeting progress offline-resume validation
on:
  push:
    branches: [gpt/b129-priority-three]
permissions:
  contents: read
concurrency:
  group: arcana-b130-feature-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile and run three-feature and previous regression tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --max-workers=2 :app:testDebugUnitTest \
            --tests '*IncomingTargetAlertTest*' \
            --tests '*EngineProcessingInfoTest*' \
            --tests '*OfflineCheckpointStoreTest*' \
            --tests '*OfflineEngineResumeTest*' \
            --tests '*LocalArgentumHostTest*' \
            --tests '*GameLogGroupingTest*' \
            --tests '*DecisionDisplayTextTest*' \
            --tests '*ReadableNotificationDurationTest*' \
            --tests '*TableOverviewInteractionTest*' \
            --tests '*ZonePlaySourceTest*' \
            --tests '*GraveyardExileLegalActionsTest*' \
            --tests '*ZoneCardActionsUiTest*'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Arcana-B130-priority-three-test-results
          path: |
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
