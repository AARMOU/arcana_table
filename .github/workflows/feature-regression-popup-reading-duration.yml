name: Arcana feature regression popup-reading-duration
on:
  push:
    branches:
      - gpt/work-popup-notifications
permissions:
  contents: read
concurrency:
  group: arcana-feature-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install API 36 build prerequisites
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Run ReadableNotificationDurationTest and compile app sources
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --max-workers=2 :app:testDebugUnitTest --tests '*ReadableNotificationDurationTest*'
      - name: Upload unit-test XML reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcana-popup-reading-duration-unit-test-results
          path: |
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
