name: Card Request Intake CI
on:
  pull_request:
    paths:
      - 'android/card-request-worker/**'
      - 'android/app/src/main/java/com/arcanatable/CardRequests.kt'
      - 'android/app/src/main/java/com/arcanatable/TableOverlaysB.kt'
      - 'android/app/src/test/java/com/arcanatable/CardRequestsTest.kt'
      - 'android/app/build.gradle.kts'
      - '.github/workflows/card-request-intake-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  worker-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run name validation, dedupe and retry tests without credentials
        run: node --test android/card-request-worker/tests/card-requests.test.mjs
      - run: git diff --check
  android-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Pin Google's published commandline-tools SHA-256; the hosted runner does not include sdkmanager.
      - name: Prepare SDK 36
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          curl -fL --retry 2 "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" -o "$RUNNER_TEMP/cmdline.zip"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $RUNNER_TEMP/cmdline.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/cmdline.zip" -d "$RUNNER_TEMP/sdk-unpacked"
          mv "$RUNNER_TEMP/sdk-unpacked/cmdline-tools/"* "$ANDROID_HOME/cmdline-tools/latest/"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          (yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > /dev/null) || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile importer UI and run focused Android test
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --tests com.arcanatable.CardRequestsTest --no-daemon --stacktrace
