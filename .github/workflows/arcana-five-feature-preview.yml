name: Arcana Build 129 five-feature debug APK
on:
  push:
    branches:
      - gpt/arcana-five-feature-preview
permissions:
  contents: read
concurrency:
  group: arcana-five-feature-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile-test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout isolated combined source
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install API 36 SDK and build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile and run all five targeted feature suites and existing rule regressions
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --max-workers=2 :app:testDebugUnitTest \
            --tests '*DecisionDisplayTextTest*' \
            --tests '*GameLogGroupingTest*' \
            --tests '*ReadableNotificationDurationTest*' \
            --tests '*TableViewNavigationTest*' \
            --tests '*TableOverviewInteractionTest*' \
            --tests '*ZonePlaySourceTest*' \
            --tests '*GraveyardExileLegalActionsTest*' \
            --tests '*ZoneCardActionsUiTest*' \
            --tests '*ArgentumInteractionTest*' \
            --tests '*GameRulesTest*'
      - name: Assemble debug-signed test APK (separate application identity)
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 :app:assembleDebug
      - name: Verify test package and signing certificate; create SHA256 provenance
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/ArcanaTable-B129-Five-Feature-Preview-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging dist/ArcanaTable-B129-Five-Feature-Preview-debug.apk | head -n 8 | tee dist/package-info.txt
          grep -F "package: name='com.arcanatable.argentum' versionCode='129' versionName='0.33.7-build129-five-feature-preview'" dist/package-info.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs dist/ArcanaTable-B129-Five-Feature-Preview-debug.apk | tee dist/signing-info.txt
          printf 'branch=%s\ncommit=%s\ntest_package=com.arcanatable.argentum\nsignature=Android debug signing (NOT the Play Store production signing key)\nproduction_changed=false\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" > dist/provenance.txt
          sha256sum dist/ArcanaTable-B129-Five-Feature-Preview-debug.apk > dist/SHA256SUMS.txt
      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ArcanaTable-Five-Feature-Test-Reports
          path: |
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload signed installable debug preview APK
        uses: actions/upload-artifact@v4
        with:
          name: ArcanaTable-B129-Five-Feature-Debug-APK
          path: dist/
          if-no-files-found: error
          retention-days: 14
