name: Argentum collision pattern-index refresh (isolated)
on:
  push:
    branches: [gpt/argentum-collision-retirement-20261025]
    paths: [.github/workflows/argentum-collision-pattern-refresh.yml]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Generate Cardkit pattern indexes and show exact patch
        shell: bash
        run: |
          set -euo pipefail
          tools/cardkit/cardkit patterns
          git diff --check
          git diff -- docs/agents/generated/pattern-index.json docs/agents/generated/pattern-index.md
      - name: Verify docs after generation
        run: python3 -m unittest discover -s tools/cardkit/tests
