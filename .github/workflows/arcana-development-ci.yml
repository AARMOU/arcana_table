name: Arcana Development CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arcana-development-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  custom-cards:
    name: Custom-card export and scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify custom-card module exists
        run: test -f android/custom-cards/build.gradle.kts
      - name: Run every custom-card scenario and export
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 :custom-cards:exportCards :custom-cards:test
      - name: Verify exported index and JSONL agree
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('android/app/src/main/assets/argentum')
          names = [line.split('\t')[0] for line in (root/'custom-cards.index.tsv').read_text().splitlines() if line.strip()]
          exported = [json.loads(line)['name'] for line in (root/'custom-cards.jsonl').read_text().splitlines() if line.strip()]
          assert names == exported, 'Card index and exported data disagree'
          assert len(names) == len({n.casefold() for n in names}), 'Duplicate card names'
          print(f'Validated {len(names)} exported custom-card definitions')
          PY
      - name: Verify no uncommitted export drift
        run: git diff --exit-code -- android/app/src/main/assets/argentum/custom-cards.jsonl android/app/src/main/assets/argentum/custom-cards.index.tsv
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-card-regression-${{ github.run_id }}
          path: |
            android/custom-cards/build/test-results/
            android/custom-cards/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14
  android-unit:
    name: Android JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Run Android unit tests
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-${{ github.run_id }}
          path: |
            android/app/build/test-results/
            android/app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14
