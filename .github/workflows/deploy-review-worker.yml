name: Deploy Arcana Control review Worker (manual only)
# Owner-run only. Deploys control/review-worker (card Approve / Request Fix and exact-unit owner authorization) from main.
# Reuses the existing Cloudflare secrets of the card-request Worker. Needs, once:
#   variable REVIEW_OAUTH_CLIENT_ID, secrets REVIEW_OAUTH_CLIENT_SECRET and REVIEW_SESSION_SECRET (>= 32 chars).
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY_REVIEW_WORKER to authorize the Cloudflare change"
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: arcana-review-worker-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'AARMOU/arcana_table' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Verify explicit intent and setup
        shell: bash
        env:
          APPROVAL: ${{ inputs.confirmation }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLIENT_ID: ${{ vars.REVIEW_OAUTH_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.REVIEW_OAUTH_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.REVIEW_SESSION_SECRET }}
        run: |
          set -euo pipefail
          test "$APPROVAL" = "DEPLOY_REVIEW_WORKER" || { echo 'Missing explicit confirmation'; exit 1; }
          for v in "$CF_TOKEN" "$CF_ACCOUNT" "$CLIENT_ID" "$CLIENT_SECRET" "$SESSION_SECRET"; do test -n "$v" || { echo 'A required variable or secret is missing (see docs/REVIEW-APPROVALS.md)'; exit 1; }; done
          test "${#SESSION_SECRET}" -ge 32 || { echo 'REVIEW_SESSION_SECRET must be at least 32 characters'; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Worker tests before production
        run: node --test control/review-worker/tests/*.test.mjs
      - name: Deploy and configure
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLIENT_ID: ${{ vars.REVIEW_OAUTH_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.REVIEW_OAUTH_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.REVIEW_SESSION_SECRET }}
        run: |
          set -euo pipefail
          # Wrangler >=4.74 supports uploading code and both secrets in ONE deployment.
          # Sequential secret put creates extra deployments and can leave a partial rollout
          # if Cloudflare rejects the second secrets API call (observed run #40759087947).
          npm install --no-save --no-audit --no-fund wrangler@4.74.0
          npx wrangler deploy --help | grep -F -- '--secrets-file' >/dev/null
          umask 077
          secrets_file="$(mktemp --suffix=.json "${RUNNER_TEMP}/arcana-review-secrets.XXXXXX")"
          trap 'rm -f "$secrets_file"' EXIT
          node -e 'const fs = require("node:fs"); fs.writeFileSync(process.argv[1], JSON.stringify({GITHUB_OAUTH_CLIENT_SECRET: process.env.CLIENT_SECRET, SESSION_SECRET: process.env.SESSION_SECRET}));' "$secrets_file"
          npx wrangler deploy --config control/review-worker/wrangler.toml --var "GITHUB_OAUTH_CLIENT_ID:$CLIENT_ID" --secrets-file "$secrets_file"
          echo 'Review Worker deployed with both secrets. Check https://arcana-review.arcanamtg.workers.dev/health'
