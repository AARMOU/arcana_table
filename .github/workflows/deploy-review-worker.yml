name: Deploy Arcana Control review Worker (manual only)
# Owner-run only. Deploys control/review-worker (card Approve / Request Fix and exact-unit owner authorization) from main.
# Reuses the existing Cloudflare secrets of the card-request Worker. Needs, once:
#   variable REVIEW_OAUTH_CLIENT_ID, secrets REVIEW_OAUTH_CLIENT_SECRET and REVIEW_SESSION_SECRET (>= 32 chars).
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY_REVIEW_WORKER to authorize the Cloudflare change"
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: arcana-review-worker-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'AARMOU/arcana_table' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Verify explicit intent and setup
        shell: bash
        env:
          APPROVAL: ${{ inputs.confirmation }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLIENT_ID: ${{ vars.REVIEW_OAUTH_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.REVIEW_OAUTH_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.REVIEW_SESSION_SECRET }}
        run: |
          set -euo pipefail
          test "$APPROVAL" = "DEPLOY_REVIEW_WORKER" || { echo 'Missing explicit confirmation'; exit 1; }
          for v in "$CF_TOKEN" "$CF_ACCOUNT" "$CLIENT_ID" "$CLIENT_SECRET" "$SESSION_SECRET"; do test -n "$v" || { echo 'A required variable or secret is missing (see docs/REVIEW-APPROVALS.md)'; exit 1; }; done
          test "${#SESSION_SECRET}" -ge 32 || { echo 'REVIEW_SESSION_SECRET must be at least 32 characters'; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Worker tests before production
        run: node --test control/review-worker/tests/*.test.mjs
      - name: Deploy and configure
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLIENT_ID: ${{ vars.REVIEW_OAUTH_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.REVIEW_OAUTH_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.REVIEW_SESSION_SECRET }}
          # Optional: read-only token for the public status feed (no repository write scopes).
          PUBLIC_READ_TOKEN: ${{ secrets.REVIEW_PUBLIC_READ_TOKEN }}
          # Optional: this repository only, Actions read/write only. Lets the Worker's timer start
          # the review inbox refresh and certification backfill workflows on time.
          ACTIONS_DISPATCH_TOKEN: ${{ secrets.REVIEW_ACTIONS_DISPATCH_TOKEN }}
          PUSH_KV_ID: ${{ vars.REVIEW_CARD_PUSH_KV_ID }}
          VAPID_PUBLIC: ${{ secrets.REVIEW_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE: ${{ secrets.REVIEW_VAPID_PRIVATE_JWK }}
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund wrangler@4.69.0
          # Optional owner-only push: never create Cloudflare resources or mutate bindings
          # merely by merging. The owner provisions this existing KV ID separately.
          if [ -n "${PUSH_KV_ID:-}" ] && [ -n "${VAPID_PUBLIC:-}" ] && [ -n "${VAPID_PRIVATE:-}" ]; then
            [[ "$PUSH_KV_ID" =~ ^[0-9a-f]{32}$ ]] || { echo 'Invalid REVIEW_CARD_PUSH_KV_ID'; exit 1; }
            [[ "$VAPID_PUBLIC" =~ ^[A-Za-z0-9_-]{87}$ ]] || { echo 'Invalid VAPID public key'; exit 1; }
            printf '\n[[kv_namespaces]]\nbinding = "CARD_PUSH"\nid = "%s"\n' "$PUSH_KV_ID" >> control/review-worker/wrangler.toml
          else
            echo 'Card-ready Web Push not configured. Review Worker retains existing features.'
          fi
          npx wrangler deploy --config control/review-worker/wrangler.toml --var "GITHUB_OAUTH_CLIENT_ID:$CLIENT_ID"
          printf '%s' "$CLIENT_SECRET" | npx wrangler secret put GITHUB_OAUTH_CLIENT_SECRET --config control/review-worker/wrangler.toml
          printf '%s' "$SESSION_SECRET" | npx wrangler secret put SESSION_SECRET --config control/review-worker/wrangler.toml
          if [ -n "${PUBLIC_READ_TOKEN:-}" ]; then
            printf '%s' "$PUBLIC_READ_TOKEN" | npx wrangler secret put GITHUB_PUBLIC_READ_TOKEN --config control/review-worker/wrangler.toml
          else
            echo 'REVIEW_PUBLIC_READ_TOKEN not set: public feed stays anonymous with a 15-minute cache.'
          fi
          if [ -n "${ACTIONS_DISPATCH_TOKEN:-}" ]; then
            printf '%s' "$ACTIONS_DISPATCH_TOKEN" | npx wrangler secret put GITHUB_ACTIONS_DISPATCH_TOKEN --config control/review-worker/wrangler.toml
          else
            echo 'REVIEW_ACTIONS_DISPATCH_TOKEN not set: the Worker timer starts nothing; status refresh relies on GitHub schedules.'
          fi
          if [ -n "${PUSH_KV_ID:-}" ] && [ -n "${VAPID_PUBLIC:-}" ] && [ -n "${VAPID_PRIVATE:-}" ]; then
            printf '%s' "$VAPID_PUBLIC" | npx wrangler secret put VAPID_PUBLIC_KEY --config control/review-worker/wrangler.toml
            printf '%s' "$VAPID_PRIVATE" | npx wrangler secret put VAPID_PRIVATE_JWK --config control/review-worker/wrangler.toml
          fi
          echo 'Review Worker deployed. Check https://arcana-review.arcanamtg.workers.dev/health'
