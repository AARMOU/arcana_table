name: Owner-authorized Chimera Cloudflare credential preflight (no deployment)
on:
  push:
    branches: [gluece/chimera-cloudflare-credential-check-20261111]
    paths:
      - '.github/workflows/chimera-cloudflare-credential-preflight.yml'
permissions:
  contents: read
jobs:
  credentials:
    if: github.repository == 'AARMOU/arcana_table' && github.ref == 'refs/heads/gluece/chimera-cloudflare-credential-check-20261111'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 3
    steps:
      - name: Check existing Cloudflare secrets without revealing values or deploying anything
        shell: bash
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then echo '::error::Arcana production CLOUDFLARE_API_TOKEN missing'; exit 1; fi
          if [ -z "$ACCOUNT" ]; then echo '::error::Arcana production CLOUDFLARE_ACCOUNT_ID missing'; exit 1; fi
          echo 'Both original Arcana production Cloudflare credentials are populated. No secrets printed.'
          RESPONSE="$(curl --silent --show-error --fail --max-time 15 'https://api.cloudflare.com/client/v4/user/tokens/verify' -H "Authorization: Bearer $TOKEN")" || { echo '::error::Cloudflare token verification request failed'; exit 1; }
          printf '%s' "$RESPONSE" | jq -e '.success == true and .result.status == "active"' > /dev/null || { echo '::error::Existing Arcana Cloudflare token not active'; exit 1; }
          echo 'Existing Arcana Cloudflare token verified ACTIVE. No deployment performed.'
