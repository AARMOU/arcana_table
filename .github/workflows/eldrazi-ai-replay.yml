name: Eldrazi AI seeded replay (NO APK)
on:
  push:
    branches: [gpt/b140-eldrazi-ai-instability-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seeded-mirror:
    strategy:
      fail-fast: false
      matrix:
        replay: [a, b, c]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Reproduce original mirror gate and initialization controls
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest --tests com.arcanatable.EldraziIncursionPlayableTest --rerun-tasks --info
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eldrazi-ai-replay-${{ matrix.replay }}-${{ github.sha }}
          path: android/app/build/test-results/
          if-no-files-found: error
