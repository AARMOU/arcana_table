name: Owner-approved Goosegeta parking (no model calls)
on:
  push:
    branches: [gpt/summon-goosegeta-approved-test-20261031]
    paths:
      - .github/workflows/goosegeta-park.yml
      - tools/goosegeta-rollout/park.mjs
permissions:
  contents: read
  actions: write
concurrency:
  group: goosegeta-isolated-room-writer
  cancel-in-progress: false
jobs:
  park:
    if: false # Runtime shutdown completed and authenticated in run 41264632755.
    # Previous guard: github.repository == 'AARMOU/arcana_table' && github.ref == 'refs/heads/gpt/summon-goosegeta-approved-test-20261031'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    concurrency:
      group: arcana-review-worker-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify scoped flag preservation
        run: node --test tools/goosegeta-rollout/park.test.mjs
      - name: Park experiment using existing identity and preserve all other bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OWNER_NO_ACTIVE_MATCH: confirmed-2026-10-31
        run: node tools/goosegeta-rollout/park.mjs
      - name: Prevent old experiment workflows from restarting the goose
        uses: actions/github-script@v7
        with:
          script: |
            const workflows=await github.paginate(github.rest.actions.listRepoWorkflows,{...context.repo,per_page:100});
            for(const w of workflows) {
              if(!/goosegeta/i.test(w.name)||/parking/i.test(w.name)) continue;
              await github.rest.actions.disableWorkflow({...context.repo,workflow_id:w.id});
              core.info('Disabled experimental workflow: '+w.name);
            }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Goosegeta-Parking-Evidence
          path: GOOSEGETA-PARKING-RESULT.json
          if-no-files-found: warn
          retention-days: 90

  preserve:
    if: github.repository == 'AARMOU/arcana_table' && github.ref == 'refs/heads/gpt/summon-goosegeta-approved-test-20261031'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bundle preserved original refs with complete ancestry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p goosegeta-archive
          git for-each-ref --format='%(refname) %(objectname)' refs/remotes/origin/archive/goosegeta/2026-10-31/ > goosegeta-archive/REFS.txt
          test "$(wc -l < goosegeta-archive/REFS.txt)" -eq 10
          mapfile -t refs < <(cut -d ' ' -f 1 goosegeta-archive/REFS.txt)
          git bundle create goosegeta-archive/Goosegeta-Original-Source.bundle "${refs[@]}"
          git bundle verify goosegeta-archive/Goosegeta-Original-Source.bundle
          sha256sum goosegeta-archive/Goosegeta-Original-Source.bundle > goosegeta-archive/SHA256SUMS
          printf '%s\n' 'Complete ancestry and source objects for the ten original archive refs.' 'No gameplay build, deploy, API inference, secret export or storage mutation.' 'Original UI and workflows are historical; do not rerun them without new owner approval.' > goosegeta-archive/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Goosegeta-Source-Preservation
          path: goosegeta-archive/
          if-no-files-found: error
          retention-days: 90
