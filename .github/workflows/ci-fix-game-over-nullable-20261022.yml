name: Isolated game-over nullable CI fix
on:
  push:
    branches:
      - gpt/ci-fix-game-over-nullable-20261022
permissions:
  contents: read
jobs:
  game-end-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Run focused and full Android unit test suites
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest
      - name: Archive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nullable-game-over-regression-results
          path: |
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
